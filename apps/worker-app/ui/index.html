<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualia Worker</title>
  <link rel="stylesheet" href="visualia.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <header>
      <h1 data-text="title"></h1>
      <p data-text="intro"></p>
    </header>

    <section id="engine">
      <div id="no-ollama" hidden>
        <p data-text="needs-ollama"></p>
        <p><a href="#" id="get-ollama" data-text="get-ollama"></a> · <a href="#" class="recheck" data-text="check-again"></a></p>
      </div>
      <div id="have-ollama" hidden>
        <p class="quiet" id="machine"></p>
        <h2 data-text="models"></h2>
        <ul id="model-list"></ul>
        <p class="quiet" id="note" hidden></p>
      </div>
    </section>

    <section id="key" hidden>
      <form id="key-form">
        <label><span data-text="key-label"></span><input id="key-input" autocomplete="off" spellcheck="false" placeholder="ABCD-EFGH"></label>
        <button data-text="key-save"></button>
      </form>
      <p class="quiet" id="key-note" data-text="key-note"></p>
    </section>

    <section id="pool" hidden>
      <div class="row">
        <button id="toggle" data-text="join"></button>
        <p id="status"></p>
      </div>
      <p class="quiet" id="live" hidden></p>
      <label class="check"><input type="checkbox" id="autostart"><span data-text="autostart"></span></label>
    </section>

    <section id="jobs-section" hidden>
      <div class="row spread"><h2 data-text="jobs"></h2><p class="quiet" id="today"></p></div>
      <ol id="jobs"></ol>
    </section>

    <section class="quiet">
      <p data-text="privacy"></p>
      <p><button id="forget" hidden data-text="forget-key"></button></p>
    </section>
  </main>
  <script src="text.js"></script>
  <script src="app.js"></script>
</body>
</html>
