[package]
name = "visualia-worker-app"
version = "0.2.0"
description = "Puts this computer's models into the class pool, outbound only"
edition = "2021"
license = "MIT"

[[bin]]
name = "visualia-worker-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
worker = { path = "../worker" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time", "signal"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native"] }
tauri-plugin-opener = "2"
tokio-util = "0.7"
