[package]
name = "visualia-pool"
version = "0.3.0"
description = "Visualia Pool: an educational tool. Shares this computer's local AI models with a Visualia pool, outbound only."
edition = "2021"
license = "MIT"

[[bin]]
name = "visualia-pool"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
worker = { path = "../worker" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time", "signal"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
# Updates: from pool.visualia.space, signed with our own key, on the system's TLS like the worker.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
tokio-util = "0.7"
