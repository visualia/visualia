[package]
name = "visualia-worker"
version = "0.1.0"
description = "Puts this computer's models into the class pool, outbound only"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native"] }
