<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What can my computer run?</title>
<link rel="stylesheet" href="./visualia.css">
<style>
  /* layout only; the look comes from visualia.css */
  .rows { display: grid; gap: var(--m); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 0 var(--m); align-items: baseline; }
  .row .note { grid-column: 1 / -1; }
  .row.no { opacity: var(--quiet); }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: var(--m) var(--l); }
  details { display: grid; gap: var(--m); }
  details[open] > summary { margin-bottom: var(--m); }
  summary { cursor: pointer; opacity: var(--quiet); }
  details > div { display: grid; gap: var(--l); }
</style>
</head>
<body>
<main>
  <header>
    <h1>What can my computer run?</h1>
  </header>

  <section>
    <div class="rows" id="can"></div>
  </section>

  <section>
    <h2>Your computer</h2>
    <div class="rows" id="machine"></div>
    <div class="rows" id="speed"></div>
    <div><button id="test" type="button">Test my computer</button></div>
  </section>

  <details>
    <summary>Details and corrections</summary>
    <div>
      <section>
        <p class="quiet">Browsers only guess memory and free space. If something above is wrong, correct it here (Mac:  menu → About This Mac, and System Settings → General → Storage).</p>
        <div class="fields">
          <label for="ram"><span>Memory</span><select id="ram"></select></label>
          <label for="gpu"><span>Graphics</span>
            <select id="gpu">
              <option value="apple">Apple, built in</option>
              <option value="none">Built in, not Apple</option>
              <option value="8">Graphics card, 8 GB</option>
              <option value="12">Graphics card, 12 GB</option>
              <option value="16">Graphics card, 16 GB</option>
              <option value="24">Graphics card, 24 GB</option>
            </select>
          </label>
          <label for="disk"><span>Free space (GB)</span><input id="disk" type="number" min="0" step="1" inputmode="numeric"></label>
        </div>
      </section>
      <section>
        <h2>Models</h2>
        <div class="rows" id="models"></div>
        <p class="quiet" id="source"></p>
      </section>
    </div>
  </details>
</main>

<script type="module">
const OVERHEAD_GB = 2; // the program running the model, plus room for a conversation
const ACTIVITIES = [
  { task: 'chat', name: 'Chat with a small AI' },
  { task: 'decision', name: 'Judge work with a decision model' },
  { task: 'page', name: 'Make web pages' },
];

const seen = await detect();
const table = await loadModels();
fillForm(seen);
render();
for (const id of ['ram', 'gpu', 'disk']) document.getElementById(id).addEventListener('input', render);
setupSpeedTest();

async function detect() {
  const ua = navigator.userAgentData;
  let hints = {};
  try { hints = ua ? await ua.getHighEntropyValues(['platform', 'platformVersion', 'architecture', 'model']) : {}; } catch {}
  const platform = hints.platform || ua?.platform || navigator.platform || 'unknown';
  const isMac = /mac/i.test(platform);
  let gpu = null;
  try {
    const adapter = await navigator.gpu?.requestAdapter();
    if (adapter) {
      const info = adapter.info ?? {};
      gpu = { vendor: info.vendor || '', architecture: info.architecture || '', description: info.description || '',
        maxBufferGb: adapter.limits?.maxBufferSize ? adapter.limits.maxBufferSize / 2 ** 30 : null };
    }
  } catch {}
  // Safari says "MacIntel" even on Apple Silicon, but its WebGPU vendor is
  // "apple"; Intel Macs have Intel or AMD graphics. So an Apple GPU settles it.
  const isArm = hints.architecture === 'arm' || /apple/i.test(gpu?.vendor ?? '');
  // Only Chromium's storage quota tracks free disk (10.8 GB quota vs 9.7 GB free
  // on macOS); Safari reported 82 GB on the same machine (2026-10-21). Use it only there.
  const chromium = !!ua?.brands?.some((b) => /chrom/i.test(b.brand));
  let quotaGb = null;
  if (chromium) {
    try { const e = await navigator.storage?.estimate(); if (e?.quota) quotaGb = e.quota / 1e9; } catch {}
  }
  return {
    platform: isMac ? 'macOS' : platform, isMac, isArm,
    cores: navigator.hardwareConcurrency || null,
    deviceMemory: navigator.deviceMemory ?? null, // Chrome: rounded; Safari and Firefox: none
    gpu, quotaGb,
  };
}

async function loadModels() {
  for (const url of ['./models.json', '../../packages/models/models.json']) {
    try { const r = await fetch(url); if (r.ok) return await r.json(); } catch {}
  }
  return { models: [], updated: '?' };
}

function fillForm(s) {
  const ram = document.getElementById('ram');
  for (const g of [8, 16, 18, 24, 32, 36, 48, 64, 96, 128]) ram.add(new Option(`${g} GB`, g));
  const opts = [...ram.options].map((o) => Number(o.value));
  ram.value = String(s.deviceMemory ? opts.reduce((a, b) => (Math.abs(b - s.deviceMemory) < Math.abs(a - s.deviceMemory) ? b : a)) : 16);
  document.getElementById('gpu').value = s.isMac && s.isArm ? 'apple' : 'none';
  document.getElementById('disk').value = s.quotaGb ? Math.floor(s.quotaGb) : '';
  document.getElementById('disk').placeholder = 'enter';
}

function render() {
  const ram = Number(document.getElementById('ram').value);
  const gpuSel = document.getElementById('gpu').value;
  const diskRaw = document.getElementById('disk').value;
  const disk = diskRaw === '' ? null : Number(diskRaw);
  // Memory a model can use: Apple's default is about 2/3 of memory up to 36 GB
  // and 3/4 above; a graphics card has its own; otherwise only the processor.
  const apple = gpuSel === 'apple';
  const card = !apple && gpuSel !== 'none';
  const usable = apple ? ram * (ram > 36 ? 0.75 : 0.67) : card ? Number(gpuSel) : ram * 0.6;
  const slow = !apple && !card;

  const fit = (m) => {
    const need = (m.peakGb ?? m.sizeGb) + OVERHEAD_GB;
    return { memory: need <= usable, disk: disk == null ? null : m.sizeGb + 2 <= disk, m };
  };
  const fits = table.models.map(fit);

  // Activities: yes if any model for it fits; otherwise say what's missing.
  const can = ACTIVITIES.map((a) => {
    const options = fits.filter((f) => f.m.tasks.includes(a.task));
    const ok = options.filter((f) => f.memory && f.disk !== false);
    if (ok.length) return { ...a, yes: true, say: slow ? 'yes, slowly' : 'yes' };
    const memOk = options.filter((f) => f.memory);
    if (memOk.length && disk != null) {
      const more = Math.ceil(Math.min(...memOk.map((f) => f.m.sizeGb + 2)) - disk);
      return { ...a, yes: false, say: 'not yet', why: `Free up ${more} GB, or use the course studio.` };
    }
    return { ...a, yes: false, say: 'no', why: 'Not enough memory. Use the course studio.' };
  });

  if (disk == null) can.find((c) => c.task === 'page').why = 'Enter your free space under Details for an exact answer.';
  document.getElementById('can').innerHTML = can.map((c) => `
    <div class="row ${c.yes ? '' : 'no'}">
      <b>${c.name}</b><span class="${c.yes ? 'bold' : ''}">${c.say}</span>
      ${c.why ? `<span class="note">${c.why}</span>` : ''}
    </div>`).join('');

  const memWord = ram >= 32 ? 'plenty' : ram >= 16 ? 'enough for small models' : 'tight';
  const diskWord = disk == null ? 'unknown' : disk >= 40 ? 'plenty' : disk >= 15 ? 'enough for small models' : 'tight';
  const gpuWord = apple ? 'Apple, good for AI' : card ? `${gpuSel} GB card, good for AI` : 'built in, slow for AI';
  const machine = [
    ['Memory', `${ram} GB, ${memWord}`],
    ['Free space', disk == null ? 'unknown' : `${disk} GB, ${diskWord}`],
    ['Graphics', gpuWord],
  ];
  document.getElementById('machine').innerHTML = machine.map(([k, v]) => `
    <div class="row"><b>${k}</b><span>${v}</span></div>`).join('');

  document.getElementById('models').innerHTML = fits.map((f) => {
    const ok = f.memory && f.disk !== false;
    const why = !f.memory ? 'needs more memory' : f.disk === false ? `needs ${f.m.sizeGb} GB free space` : `${f.m.sizeGb} GB`;
    return `<div class="row ${ok ? '' : 'no'}"><span>${f.m.name}</span><span class="${ok ? 'bold' : ''}">${ok ? 'fits' : why}</span></div>`;
  }).join('');
  document.getElementById('source').textContent = `Model list from ${table.updated}. An estimate from your computer’s size, not a speed test.`;
}

// Speed test: runs a tiny model in this tab with WebGPU (WebLLM), only on click.
// It measures how fast this computer writes, then scales that to the bigger
// models that write good pages. Nothing runs until the button is pressed.
const WEBLLM = 'https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.86/+esm';
const TEST_MODEL = 'Qwen2.5-0.5B-Instruct'; // ~290 MB download, smallest adequate chat model
const TEST_MB = 300;
const TEST_PROMPT = 'Write a short HTML page with a red circle.';
const TEST_TOKENS = 200;
const PAGE_TOKENS = 1200;   // one page with the course instructions: about 1,000–1,500 tokens
const STUDIO_SECONDS = 10;  // the course studio, for comparison
// A ~9B model has 18× the parameters of the 0.5B test model, but tiny models
// are slowed by fixed per-token overhead, not size, so speed doesn't fall 18×.
// Calibrated on an M2 Pro in Chrome (2026-10-21): 0.5B wrote 92 tokens/s, 1.5B
// wrote 57; a straight line through those (8 ms + 10 ms per GB of weights) puts
// a 9B 4-bit model (~5.5 GB) at ~16 tokens/s, about 6× slower. Rough: slower
// graphics are more size-bound, so the real ratio there is larger.
const PAGE_MODEL_RATIO = 6;

async function setupSpeedTest() {
  const btn = document.getElementById('test');
  if (!navigator.gpu) {
    speedRow('can’t test in this browser', 'Needs WebGPU; try Chrome.', true);
    btn.hidden = true;
    return;
  }
  let cached = false;
  try { cached = await modelInCache(await pickModel()); } catch {}
  speedRow('not tested yet', cached
    ? 'The test model is already on this computer, so the test takes a few seconds.'
    : `The test downloads a small model first (about ${TEST_MB} MB). It’s kept for next time.`, true);
  btn.addEventListener('click', () => runSpeedTest(btn, cached));
}

// Checks WebLLM's cache directly, so the page loads nothing until the click.
async function modelInCache(model) {
  if (!(await caches.has('webllm/model'))) return false;
  const keys = await (await caches.open('webllm/model')).keys();
  return keys.some((r) => r.url.includes(`/${model}/`) && /params_shard_0\.bin$/.test(r.url));
}

async function pickModel() {
  // q4f16 needs 16-bit shaders; older graphics only have 32-bit.
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error('no adapter');
  return `${TEST_MODEL}-${adapter.features.has('shader-f16') ? 'q4f16_1' : 'q4f32_1'}-MLC`;
}

function speedRow(answer, note, quiet = false) {
  document.getElementById('speed').innerHTML = `
    <div class="row ${quiet ? 'no' : ''}">
      <b>Speed</b><span class="${quiet ? '' : 'bold'}">${answer}</span>
      ${note ? `<span class="note">${note}</span>` : ''}
    </div>`;
}

async function runSpeedTest(btn, cached) {
  btn.disabled = true;
  let engine;
  try {
    speedRow('starting…', 'Keep this tab open.', true);
    const webllm = await import(WEBLLM);
    const model = await pickModel();
    engine = await webllm.CreateMLCEngine(model, {
      initProgressCallback: ({ progress }) => {
        const pct = Math.floor((progress ?? 0) * 100);
        speedRow(`${pct}%`, cached
          ? 'Loading the test model…'
          : `Downloading a small test model, ${TEST_MB} MB… It’s kept for next time.`, true);
      },
    });
    speedRow('testing…', 'Writing a short page to time it.', true);
    const stream = await engine.chat.completions.create({
      messages: [{ role: 'user', content: TEST_PROMPT }],
      max_tokens: TEST_TOKENS, temperature: 0, ignore_eos: true,
      stream: true, stream_options: { include_usage: true },
    });
    // Time only the writing: from the first token to the last (no download, no reading the prompt).
    let first = 0, last = 0, chunks = 0, usage = null;
    for await (const c of stream) {
      if (c.choices?.[0]?.delta?.content) { const t = performance.now(); if (!first) first = t; last = t; chunks++; }
      if (c.usage) usage = c.usage;
    }
    const tokens = usage?.completion_tokens ?? chunks;
    const measured = first && last > first ? (tokens - 1) / ((last - first) / 1000) : 0;
    const tps = usage?.extra?.decode_tokens_per_s || measured;
    console.info('speed test', JSON.stringify({ model, tokens, measured, extra: usage?.extra }));
    if (!tps) throw new Error('no tokens');
    showSpeed(tps);
    btn.textContent = 'Test again';
  } catch (e) {
    console.warn('speed test failed', e);
    speedRow('couldn’t finish', plainError(e), true);
  } finally {
    try { await engine?.unload(); } catch {}
    btn.disabled = false;
  }
}

function showSpeed(tps) {
  const round = (n) => (n >= 20 ? Math.round(n / 5) * 5 : Math.max(1, Math.round(n)));
  const secs = (s) => (s < 30 ? `${Math.max(1, Math.round(s))} s` : s < 90 ? `${Math.round(s / 10) * 10} s` : `${Math.round(s / 60)} min`);
  const big = tps / PAGE_MODEL_RATIO;
  speedRow(`${Math.round(tps)} tokens a second`,
    `That’s a tiny test model. A model good enough for pages (about 9B) would write about ${round(big)} tokens a second here, `
    + `so a page would take about ${secs(PAGE_TOKENS / big)}; the course studio takes about ${STUDIO_SECONDS} s. A rough estimate.`);
}

function plainError(e) {
  const m = String(e?.message ?? e ?? '');
  if (/memory|oom|allocat|too large|exceed/i.test(m)) return 'Not enough graphics memory for the test. Close other tabs and apps, then try again.';
  if (/fetch|network|download|load failed|cors|404|403|quota|storage|cache/i.test(m)) return 'The test model couldn’t download. Check the connection (a school network may block it) and free space, then try again.';
  if (/device.*lost|lost.*device/i.test(m)) return 'The graphics chip stopped the test. Close other tabs and try again.';
  if (/adapter|webgpu|gpu/i.test(m)) return 'This browser can’t use the graphics chip for the test (needs WebGPU; try Chrome).';
  return 'Something stopped the test. Reload the page and try again.';
}
</script>
</body>
</html>
