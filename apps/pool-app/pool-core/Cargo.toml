[package]
name = "pool-core"
version = "0.4.1"
description = "Visualia Pool: puts this computer's Ollama models into the class pool, outbound only"
edition = "2021"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "visualia-pool-cli"
path = "src/main.rs"
required-features = ["native"]

# The terminal version of the first screen needs the network part.
[[example]]
name = "onboard"
required-features = ["native"]

[features]
# Without `native` only `core` is built (no network, no files): the part a
# browser tab could share as WebAssembly.
default = ["native", "upscale", "cutout"]
# Upscale jobs: Real-ESRGAN in Burn on the graphics chip (../upscale), no Ollama.
upscale = ["native", "dep:upscale", "dep:base64"]
# Background removal: BiRefNet-lite with ONNX Runtime (`ort`, its library linked
# in at build), on the CPU, no other program (plans/pool-3d.md).
cutout = ["native", "dep:ort", "dep:image", "dep:base64"]
native = ["dep:sha2", "dep:base64", "dep:tokio", "dep:tokio-util", "dep:tokio-tungstenite", "dep:futures-util", "dep:reqwest", "dep:chrono", "dep:macmon"]

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "sync", "io-util", "fs"], optional = true }
tokio-util = { version = "0.7", optional = true }
tokio-tungstenite = { version = "0.26", features = ["native-tls"], optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "stream", "json"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
upscale = { path = "../upscale", optional = true }
sha2 = { version = "=0.10.9", optional = true }
base64 = { version = "=0.22.1", optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-31"], optional = true }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"], optional = true }

# Power, temperatures and memory on Apple Silicon (meter.rs): macmon's library
# (MIT), without its app (no TUI, no CLI), linked in instead of a bundled binary.
[target.'cfg(target_os = "macos")'.dependencies]
macmon = { version = "=0.10.0", default-features = false, optional = true }
