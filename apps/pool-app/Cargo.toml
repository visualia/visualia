# The Visualia Pool app and program (README.md):
#   pool-core  `core` (no I/O, also builds for wasm32) and the native part
#              around it, plus the `visualia-pool-cli` program.
#   src-tauri  the app: a window around the same code.
[workspace]
members = ["pool-core", "src-tauri", "upscale"]
resolver = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
