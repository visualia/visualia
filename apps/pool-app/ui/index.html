<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualia Pool</title>
  <link rel="stylesheet" href="visualia.css">
  <link rel="stylesheet" href="pool.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <header>
      <h1 data-text="title"></h1>
      <p data-text="intro"></p>
      <p class="quiet" id="version"></p>
      <p id="update" hidden><span id="update-text"></span> <a href="#" id="update-go" data-text="update"></a></p>
    </header>

    <section id="engine">
      <div id="no-ollama" hidden>
        <p data-text="needs-ollama"></p>
        <p><a href="#" id="get-ollama" data-text="get-ollama"></a><a href="#" class="recheck apart" data-text="check-again"></a></p>
      </div>
      <div id="have-ollama" hidden>
        <h2 data-text="models"></h2>
        <table class="pool models">
          <tbody id="model-list"></tbody>
        </table>
        <p class="quiet" id="machine"></p>
        <p class="quiet" id="note" hidden></p>
      </div>
    </section>

    <section id="key" hidden>
      <form id="key-form" class="key-row">
        <label><span data-text="key-label"></span><input id="key-input" autocomplete="off" spellcheck="false" placeholder="ABCD-EFGH"></label>
        <button data-text="key-save"></button>
      </form>
      <p class="quiet" id="key-note" data-text="key-note"></p>
    </section>

    <section id="pool" hidden>
      <div class="row">
        <p id="status"></p>
        <button id="toggle" data-text="join"></button>
      </div>
      <p class="quiet" id="live" hidden></p>
    </section>

    <section id="jobs-section" hidden>
      <div class="row spread"><h2 data-text="work-done"></h2><p class="quiet" id="today"></p></div>
      <table class="pool jobs">
        <thead class="quiet"><tr><th class="clock" data-text="col-time"></th><th class="wide" data-text="col-model"></th><th class="n" data-text="col-tokens"></th><th class="n" data-text="col-seconds"></th><th class="n" data-text="col-wh"></th></tr></thead>
        <tbody id="job-rows"></tbody>
      </table>
    </section>

    <section class="quiet">
      <p data-text="privacy"></p>
      <p><button id="forget" hidden data-text="forget-key"></button></p>
    </section>
  </main>
  <script src="text.js"></script>
  <script src="app.js"></script>
</body>
</html>
