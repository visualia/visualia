[package]
name = "upscale"
version = "0.1.0"
description = "Visualia Pool: Real-ESRGAN image upscaling in Rust (Burn), for the app and a browser tab"
edition = "2021"
license = "MIT"

# Spike (plans/local-images.md, "Upscaling"): the ONNX files are turned into
# Burn code at build time (build.rs), so nothing but this crate runs a model.
# The models (BSD-3) come from Qualcomm AI Hub's exports, fetched into
# models/ (not in git): see README.md.

[features]
default = ["metal"]
metal = ["burn/metal"]
wgpu = ["burn/wgpu"]
webgpu = ["burn/webgpu"]
cpu = ["burn/flex"]

[dependencies]
burn = { version = "=0.22.1", default-features = false, features = ["std", "fusion", "autotune"] }
burn-store = { version = "=0.22.1", default-features = false, features = ["std"] }

image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[build-dependencies]
burn-onnx = { version = "=0.22.0" }
