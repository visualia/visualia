<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChilloutMix</title>
<link rel="stylesheet" href="visualia.css">
<style>.pair { display: flex; align-items: center; gap: var(--m); } canvas { max-width: 100%; height: auto; }</style>
</head>
<body>
<main>
  <header>
    <h1>ChilloutMix</h1>
    <p class="quiet">Draws a 512 × 512 picture from English text on this computer's graphics card, in 20 steps. The first picture downloads 2.1 GB of models.</p>
  </header>
  <section>
    <label><span>Text</span><input id="prompt" value="a lighthouse on a rocky coast at sunset, photo"></label>
    <label><span>Seed</span><input id="seed" type="number" value="1" min="1"></label>
    <p class="pair"><button id="go">Draw</button><span id="pct"></span></p>
    <p id="status" class="quiet"></p>
  </section>
  <section>
    <canvas id="out" width="512" height="512" hidden></canvas>
    <a id="save" download="chilloutmix.png" hidden>Save PNG</a>
  </section>
</main>
<script type="module">
import { generate, toPng } from "./run.js";

const $ = (id) => document.getElementById(id);
const say = (line) => { $("status").textContent = line; };
const mb = (n) => Math.round(n / 1e6);
const s = (n) => n.toFixed(1);
// The button fills while it works; its label stays, the number is beside it.
const progress = (share) => {
  const p = Math.round(share * 100);
  $("go").classList.add("progress");
  $("go").style.setProperty("--progress", `${p}%`);
  $("pct").textContent = `${p}%`;
};
const done = () => { $("go").classList.remove("progress"); $("go").style.removeProperty("--progress"); $("pct").textContent = ""; };

$("go").onclick = async () => {
  if (!navigator.gpu) return say("This browser has no WebGPU. Try a recent Chrome or Edge.");
  $("go").disabled = true;
  const t0 = performance.now();
  try {
    const { rgb, times } = await generate({
      prompt: $("prompt").value,
      seed: Number($("seed").value) || 1,
      onProgress: (name, got, total) => { progress(got / total); say(`Downloading ${name}: ${mb(got)} of ${mb(total)} MB`); },
      onStatus: (stage, step, steps) => { if (step) progress(step / steps); say(step ? `Drawing: step ${step} of ${steps}` : `Loading: ${stage}`); },
    });
    const png = await toPng(rgb);
    $("out").getContext("2d").drawImage(await createImageBitmap(png), 0, 0);
    $("out").hidden = false;
    $("save").href = URL.createObjectURL(png);
    $("save").hidden = false;
    const all = (performance.now() - t0) / 1000;
    say(`Done in ${s(all)} s. Text ${s(times.text)} s, steps ${s(times.steps)} s, decoding ${s(times.vae)} s.`);
    window.lastTimes = { all, ...times };
    console.log("times", JSON.stringify(window.lastTimes));
  } catch (e) {
    say(`Stopped: ${e.message}`);
    console.error(e);
  } finally {
    done();
    $("go").disabled = false;
  }
};
</script>
</body>
</html>
