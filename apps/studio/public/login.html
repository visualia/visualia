<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualia</title>
<link rel="stylesheet" href="/visualia.css">
</head>
<body>
<main>
  <header>
    <h1 data-text="app-name"></h1>
    <p class="quiet" data-text="login-intro"></p>
  </header>
  <form method="post" action="/login">
    <section>
      <label for="key"><span data-text="key-label"></span><input id="key" name="key" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABCD-EFGH" required></label>
      <p id="wrong" class="bold" hidden data-text="key-wrong"></p>
      <p><button type="submit" data-text="sign-in"></button></p>
    </section>
  </form>
  <p><a href="https://probe.visualia.space" data-text="probe-link"></a></p>
</main>
<script src="/text.js"></script>
<script>if (location.search.includes('wrong')) document.getElementById('wrong').hidden = false;</script>
</body>
</html>
