<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualia</title>
<link rel="stylesheet" href="/visualia.css">
</head>
<body>
<main>
  <header>
    <h1>Visualia</h1>
    <p class="quiet">Describe a page, watch it being made, change it, publish it.</p>
  </header>
  <form method="post" action="/login">
    <section>
      <label for="key"><span>Course key</span><input id="key" name="key" type="password" autocomplete="current-password" required></label>
      <p id="wrong" class="bold" hidden>That key didn’t work.</p>
      <p><button type="submit">Sign in</button></p>
    </section>
  </form>
</main>
<script>if (location.search.includes('wrong')) document.getElementById('wrong').hidden = false;</script>
</body>
</html>
