<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Visualia</title>
<link rel="stylesheet" href="/visualia.css">
<link rel="stylesheet" href="/board/wall.css">
<style>
  /* The page is exactly the visible screen; the chat and the work scroll inside it.
     --vh follows the on-screen keyboard where the browser doesn't resize (iOS). */
  html, body { height: 100%; overflow: hidden; }
  [hidden] { display: none !important; } /* the forms and the sheet below set their own display */
  body { padding: 0; }
  .home { height: var(--vh, 100dvh); display: grid; grid-template-columns: minmax(0, 26rem) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  .views { display: none; }
  .chat, .work { min-height: 0; display: grid; }
  .chat { grid-template-rows: auto minmax(0, 1fr) auto; }
  .chat > header, .messages, .say { padding-inline: var(--m); }
  .chat > header { padding-top: var(--m); padding-bottom: var(--s); gap: var(--s); }
  .messages { overflow-y: auto; overscroll-behavior: contain; display: grid; align-content: start; gap: var(--m); padding-bottom: var(--m); overflow-wrap: anywhere; }
  .msg { display: grid; gap: var(--s); }
  .msg p { white-space: pre-wrap; }
  .msg .who { opacity: var(--quiet); }
  .say { display: grid; gap: var(--s); padding-top: var(--s); padding-bottom: max(var(--m), env(safe-area-inset-bottom)); }
  .say form { display: grid; grid-template-columns: 1fr auto; gap: var(--s); align-items: end; }
  .say textarea { min-height: 0; resize: none; max-height: 8rem; }
  .work { overflow-y: auto; overscroll-behavior: contain; align-content: start; gap: var(--m); padding: var(--m); padding-bottom: max(var(--m), env(safe-area-inset-bottom)); }
  form.new { display: grid; grid-template-columns: 1fr auto; gap: var(--s); align-items: end; }
  .layouts { display: flex; flex-wrap: wrap; gap: var(--m); }
  .layouts a { opacity: var(--quiet); text-decoration: none; }
  .layouts a[aria-current] { opacity: 1; text-decoration: underline; }
  .layouts .arrange { margin-left: auto; display: flex; gap: var(--m); }
  .layouts .arrange a { opacity: 1; text-decoration: underline; }
  form.group { display: grid; grid-template-columns: 1fr auto; gap: var(--s); align-items: end; }
  form.group p { grid-column: 1 / -1; display: flex; gap: var(--m); }
  /* "Put with…": the groups as a list of links over the bottom of the screen */
  .sheet { position: fixed; inset: auto 0 0 0; z-index: 2; display: grid; gap: var(--s); justify-items: start; max-height: 60dvh; overflow-y: auto;
    padding: var(--m) 1rem max(var(--m), env(safe-area-inset-bottom)); background: var(--paper); border-top: 1px solid currentColor; }
  .sheet a[aria-current] { text-decoration: none; opacity: var(--quiet); }
  /* the wall: its own width decides the view (feed under 700 px, canvas above);
     the feed scrolls with this column, the canvas fills most of the screen */
  #wall { margin-inline: -1rem; }
  #wall.pans { height: max(20rem, calc(var(--vh, 100dvh) - 13rem)); margin-inline: 0; outline: 1px solid color-mix(in srgb, currentColor 15%, transparent); }
  .shared .title { text-decoration: underline; text-underline-offset: 0.2em; }
  .shared { display: grid; gap: var(--s); justify-items: start; text-decoration: none; }
  .shared .thumb { width: 10rem; }
  .links { display: grid; gap: var(--s); }
  .mine { display: grid; gap: var(--s); justify-items: start; }
  .mine:empty { display: none; }

  @media (max-width: 640px) {
    .home { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .views { display: flex; gap: var(--m); padding: var(--s) 1rem 0; padding-top: max(var(--s), env(safe-area-inset-top)); }
    .views a { opacity: var(--quiet); text-decoration: none; }
    .views a[aria-current] { opacity: 1; text-decoration: underline; }
    .home[data-view="chat"] .work, .home[data-view="work"] .chat { display: none; }
    .chat > header, .messages, .say { padding-inline: 1rem; }
    .chat > header { padding-top: var(--s); }
    .chat > header h2 { display: none; }
    .work { padding: var(--m) 1rem; }
    .work > header h2 { display: none; }
  }
</style>
</head>
<body>
<div class="home" id="home" data-view="chat">
  <nav class="views" id="views">
    <a href="#chat" data-view="chat" aria-current="page">Chat</a>
    <a href="#work" data-view="work">Everyone's work</a>
  </nav>

  <section class="chat" aria-label="Class chat">
    <header>
      <h2>Chat</h2>
      <p class="quiet" id="online"></p>
    </header>
    <div class="messages" id="messages" aria-live="polite"></div>
    <div class="say">
      <p class="quiet" id="sharing" hidden></p>
      <form id="say">
        <textarea id="text" rows="1" aria-label="Message" placeholder="Message"></textarea>
        <button type="submit">Send</button>
      </form>
    </div>
  </section>

  <section class="work" aria-label="Everyone's work">
    <header>
      <h2>Everyone's work</h2>
      <form class="new" id="new">
        <label for="title"><span>New project</span><input id="title" name="title" placeholder="What do you want to make?" required></label>
        <button type="submit">Start</button>
      </form>
      <nav class="layouts" id="layouts" aria-label="View">
        <a href="#" data-layout="canvas">Canvas</a>
        <a href="#" data-layout="feed">Newest first</a>
        <a href="#" data-layout="people">By person</a>
        <span class="arrange"><a href="#" id="new-group" hidden>New group</a><a href="#" id="undo" hidden>Undo</a></span>
      </nav>
      <form class="group" id="group" hidden>
        <label for="group-name"><span id="group-what">New group</span><input id="group-name" maxlength="80" required></label>
        <button type="submit" id="group-ok">Add</button>
        <p><a href="#" id="group-delete" hidden>Delete group</a><a href="#" id="group-close">Close</a></p>
      </form>
    </header>
    <div id="wall" aria-label="Everyone's work"></div>
    <p class="quiet" id="empty" hidden>No projects yet.</p>
    <div class="mine" id="mine" aria-label="Your private projects"></div>
    <div class="sheet" id="put" hidden>
      <p id="put-what"></p>
      <div class="links" id="put-groups"></div>
      <a href="#" id="put-cancel">Cancel</a>
    </div>
    <div class="links">
      <a href="/usage">Usage</a>
      <a href="https://probe.visualia.space">What can my computer run?</a>
      <form method="post" action="/logout"><button type="submit">Sign out</button></form>
    </div>
  </section>
</div>
<script type="module">
import { createWall } from '/board/wall.js';
import { createClient } from '/board/sync.js';
import { place, unplace, newGroup, rename, removeGroup, items } from '/board/doc.js';
const $ = (x) => document.getElementById(x);
let me = null, school = null, messages = [], more = false, share = null, ws, retry = 1000, projects = [], mine = [];

// ---- views (phone): Chat / Everyone's work ----------------------------------
function view(name) {
  $('home').dataset.view = name;
  for (const a of $('views').querySelectorAll('a')) a.toggleAttribute('aria-current', a.dataset.view === name);
  if (name === 'chat') toBottom();
  else loadWork();
}
for (const a of $('views').querySelectorAll('a')) a.addEventListener('click', (e) => { e.preventDefault(); history.replaceState(null, '', `#${a.dataset.view}`); view(a.dataset.view); });
if (location.hash === '#work') view('work');

// The visible height, so the input stays above the on-screen keyboard (iOS
// doesn't shrink 100dvh for it).
const vv = window.visualViewport;
if (vv) {
  const fit = () => {
    document.documentElement.style.setProperty('--vh', `${vv.height}px`);
    window.scrollTo(0, 0);
    if (nearBottom(200)) toBottom();
  };
  vv.addEventListener('resize', fit); fit();
}

// ---- everyone's work: the wall (packages/board), live from the Class DO -------
// The class socket brings a snapshot of the board, then each change; a new
// version anywhere moves that work to the top without a reload. Arranging
// (moves, groups, undo) goes back the same way: shown at once, sequenced by
// the class, and seen by everyone (plans/board.md, step 4).
const board = createClient({
  send: (m) => ws?.readyState === WebSocket.OPEN && ws.send(JSON.stringify(m)),
  onChange: () => {
    wall.refresh();
    $('empty').hidden = Object.keys(board.doc.items).length > 0;
    $('undo').hidden = !board.canUndo;
    if (editing && (!board.doc.items[editing] || board.doc.items[editing].gone)) closeGroup();
  },
});
const nameOf = (id) => (id === me ? 'you' : id);
const wall = createWall($('wall'), {
  scroller: document.querySelector('.work'),
  imageUrl: (it, w) => (it.shot ? `/thumb/${it.project}/${it.shot}/${w}` : null),
  placeholder: (it) => (it.ph ? `data:image/webp;base64,${it.ph}` : null),
  nameOf,
  onOpen: (id) => { location.href = `/p/${board.doc.items[id].project}`; },
  onOp: (op) => board.local(op),
  onDrag: drag,
  onGroup: openGroup,
  onPut: openPut,
});
wall.set(board.doc);

// A drag is presence, not an op: where the work is now, at most 20 times a
// second (the latest wins), and null when it's let go. Never stored.
let dragging = null, dragTimer = 0;
function drag(id, at) {
  dragging = { id, at };
  if (!at) { clearTimeout(dragTimer); dragTimer = 0; return sendDrag(); }
  if (!dragTimer) { sendDrag(); dragTimer = setTimeout(function tick() { dragTimer = 0; if (dragging?.sent === false) { sendDrag(); dragTimer = setTimeout(tick, 50); } }, 50); }
  else dragging.sent = false;
}
function sendDrag() {
  if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'drag', id: dragging.id, at: dragging.at }));
  dragging.sent = true;
}
const ghostTimers = new Map();
function ghost(m) {
  wall.ghost(m.person, m.id, m.at, nameOf(m.person));
  clearTimeout(ghostTimers.get(m.person));
  if (m.at) ghostTimers.set(m.person, setTimeout(() => wall.ghost(m.person, m.id, null), 3000)); // they went quiet
}

// Undo: only my own changes, newest first (sync.js says how).
$('undo').addEventListener('click', (e) => { e.preventDefault(); board.undo(); });
addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() !== 'z' || !(e.metaKey || e.ctrlKey) || e.shiftKey || e.altKey) return;
  if (e.target.closest?.('input, textarea')) return; // the field's own undo
  e.preventDefault();
  board.undo();
});

// Groups: New group (in the middle of the view); click a group's name to rename or delete it.
let editing = null;
function openGroup(id) {
  editing = id ?? null;
  const g = id && board.doc.items[id];
  $('group-what').textContent = g ? 'Group' : 'New group';
  $('group-name').value = g ? g.name : '';
  $('group-ok').textContent = g ? 'Rename' : 'Add';
  $('group-delete').hidden = !g;
  $('group').hidden = false;
  $('group-name').focus();
}
function closeGroup() { editing = null; $('group').hidden = true; }
$('new-group').addEventListener('click', (e) => { e.preventDefault(); openGroup(null); });
$('group-close').addEventListener('click', (e) => { e.preventDefault(); closeGroup(); });
$('group-delete').addEventListener('click', (e) => { e.preventDefault(); board.local(removeGroup(editing)); closeGroup(); });
$('group').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = $('group-name').value.trim();
  if (!name) return;
  if (editing) board.local(rename(editing, name));
  else {
    const c = wall.center();
    board.local(newGroup(`g-${crypto.randomUUID().slice(0, 8)}`, name, { x: c.x - 424, y: c.y - 160 }));
  }
  closeGroup();
});

// Put with…: a phone places a work with taps. Picking a group puts it in the group's next slot.
let putting = null;
function openPut(id) {
  putting = id;
  const it = board.doc.items[id];
  const groups = items(board.doc, 'group').sort((a, b) => a.name.localeCompare(b.name));
  $('put-what').textContent = groups.length ? `Put ${it.title} with` : 'No groups yet. Make one on the canvas.';
  $('put-groups').innerHTML = groups.map((g) => `<a href="#" data-group="${g.id}"${it.in === g.id ? ' aria-current="true"' : ''}>${escape(g.name)}</a>`).join('')
    + (it.in || it.at ? '<a href="#" data-group="">Not placed yet</a>' : '');
  $('put').hidden = false;
}
$('put-groups').addEventListener('click', (e) => {
  const a = e.target.closest('a[data-group]');
  if (!a) return;
  e.preventDefault();
  const it = board.doc.items[putting];
  if (it && it.in !== a.dataset.group) board.local(a.dataset.group ? place(board.doc, putting, a.dataset.group) : unplace(putting));
  $('put').hidden = true;
});
$('put-cancel').addEventListener('click', (e) => { e.preventDefault(); $('put').hidden = true; });

// Canvas, Newest first or By person; by the wall's width until someone picks (remembered here).
let chosen = 'auto';
try { chosen = localStorage.getItem('wall-layout') ?? 'auto'; } catch {}
function layout(name) {
  chosen = name;
  wall.layout(name);
  for (const a of $('layouts').querySelectorAll('a[data-layout]')) a.toggleAttribute('aria-current', a.dataset.layout === wall.current);
  $('new-group').hidden = wall.current !== 'canvas';
  if (wall.current !== 'canvas') closeGroup();
}
for (const a of $('layouts').querySelectorAll('a[data-layout]')) a.addEventListener('click', (e) => {
  e.preventDefault();
  try { localStorage.setItem('wall-layout', a.dataset.layout); } catch {}
  layout(a.dataset.layout);
});
layout(chosen);
new ResizeObserver(() => chosen === 'auto' && layout('auto')).observe($('wall'));

// Your private projects (only you see these; the class sees one once you share it).
async function loadWork() {
  const r = await fetch('/api/projects');
  if (!r.ok) return;
  const d = await r.json();
  me = d.person; school = d.school; projects = d.projects; mine = d.private ?? [];
  $('mine').innerHTML = mine.length
    ? '<p class="quiet">Your private projects</p>' + mine.map((p) => `<a href="/p/${p.id}">${escape(p.title)}</a>`).join('')
    : '';
  if (share) showSharing();
}

const thumb = (id, n) => `<img class="thumb" src="/thumb/${id}/${n}/320" alt="" loading="lazy">`;
// No screenshot (yet, or it failed): the title alone.
function noBrokenThumbs(root) {
  for (const img of root.querySelectorAll('img.thumb')) img.onerror = () => img.remove();
}

$('new').addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = $('title').value;
  const r = await fetch('/api/projects', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }) });
  if (r.ok) location.href = `/p/${(await r.json()).id}`;
});

// ---- the class chat -----------------------------------------------------------
function connect() {
  // ?since: on a reconnect the class sends only the wall's changes since then
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/agents/class/${school}?since=${board.since}`);
  ws.onopen = () => { retry = 1000; };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === 'board' || m.type === 'op' || m.type === 'ack') {
      board.receive(m);
    } else if (m.type === 'drag') {
      ghost(m);
    } else if (m.type === 'hello') {
      me = m.me; messages = m.messages; more = m.more; drawMessages(); toBottom(); online(m.online);
    } else if (m.type === 'message') {
      const stick = nearBottom(120) || m.message.person === me;
      messages.push(m.message); drawMessages();
      if (stick) toBottom();
      if (m.message.project) loadWork();
    } else if (m.type === 'presence') {
      online(m.online);
    } else if (m.type === 'older') {
      const box = $('messages'), from = box.scrollHeight - box.scrollTop;
      messages = [...m.messages, ...messages]; more = m.more; drawMessages();
      box.scrollTop = box.scrollHeight - from; // stay where you were
    }
  };
  ws.onclose = () => {
    board.disconnected();
    $('online').textContent = 'Reconnecting…';
    setTimeout(connect, retry); retry = Math.min(retry * 2, 30000);
  };
}

function online(people) {
  $('online').textContent = people.length ? `Here now: ${people.map((p) => (p === me ? 'you' : p)).join(', ')}` : '';
}

function drawMessages() {
  let prev = null;
  $('messages').innerHTML = (more ? '<p><a href="#" id="older">Earlier messages</a></p>' : '')
    + (messages.length ? '' : '<p class="quiet">No messages yet.</p>')
    + messages.filter((m) => m.text || m.project).map((m) => { // a project made private since drops out
      // A new name line only when the speaker changes or after a pause.
      const head = !prev || prev.person !== m.person || m.at - prev.at > 10 * 60 * 1000;
      prev = m;
      return `<div class="msg">
        ${head ? `<span class="who">${m.person === me ? 'you' : escape(m.person)} · ${when(m.at)}</span>` : ''}
        ${m.text ? `<p>${linkify(escape(m.text))}</p>` : ''}
        ${m.project ? shared(m.project) : ''}
      </div>`;
    }).join('');
  noBrokenThumbs($('messages'));
  $('older')?.addEventListener('click', (e) => { e.preventDefault(); ws.send(JSON.stringify({ type: 'older', before: messages[0].id })); });
}

function shared(p) {
  return `<a class="shared" href="/p/${p.id}">
    ${p.versions ? thumb(p.id, p.versions) : ''}
    <span><span class="title">${escape(p.title)}</span> <span class="quiet">· ${p.owner === me ? 'you' : escape(p.owner)}</span></span>
  </a>`;
}

$('say').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  // A pasted studio link to a project becomes the project itself.
  const project = share ?? text.match(new RegExp(`${location.host.replaceAll('.', '\\.')}/p/(\\w+)`))?.[1] ?? null;
  if (!text && !project) return;
  if (ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'say', text, project }));
  $('text').value = ''; grow(); setShare(null);
});
// Enter sends on a keyboard; on a phone Enter is a new line and Send sends.
$('text').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(hover: hover) and (pointer: fine)').matches) { e.preventDefault(); $('say').requestSubmit(); }
});
const grow = () => { const t = $('text'); t.style.height = 'auto'; t.style.height = `${t.scrollHeight + 2}px`; };
$('text').addEventListener('input', grow);

// "Share in chat" on a project page comes here as /?share=<id>.
function setShare(id) {
  share = id;
  const u = new URL(location.href); u.searchParams.delete('share'); history.replaceState(null, '', u);
  showSharing();
}
function showSharing() {
  const p = share && projects.find((x) => x.id === share);
  $('sharing').hidden = !p;
  if (p) {
    $('sharing').innerHTML = `With ${escape(p.title)} · <a href="#" id="unshare">remove</a>`;
    $('unshare').onclick = (e) => { e.preventDefault(); setShare(null); };
  }
}

function nearBottom(px) { const b = $('messages'); return b.scrollHeight - b.scrollTop - b.clientHeight < px; }
function toBottom() { const b = $('messages'); b.scrollTop = b.scrollHeight; }

// ---- helpers ------------------------------------------------------------------
function when(at) {
  const d = new Date(at), today = new Date().toDateString() === d.toDateString();
  const t = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  return today ? t : `${d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} ${t}`;
}
const linkify = (s) => s.replace(/https?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
function escape(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

// ---- start ----------------------------------------------------------------------
share = new URLSearchParams(location.search).get('share');
await loadWork();
connect();
if (share) setShare(share);
addEventListener('focus', loadWork);
</script>
</body>
</html>
