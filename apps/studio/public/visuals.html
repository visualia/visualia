<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estonia · Visualia</title>
<link rel="stylesheet" href="/visualia.css">
<style>
  main { max-width: 84rem; }
  /* One row per model: name, its ten pictures, the score */
  .models { display: grid; gap: 0; }
  .model { display: grid; grid-template-columns: 13rem 10fr 1fr; align-items: center; }
  /* The name never makes a row taller than its pictures: the grid stays gapless */
  .who { padding-right: var(--m); align-self: stretch; contain: size; overflow: hidden; align-content: center; }
  .who { display: grid; }
  .who b { font-weight: var(--bold); }
  header p { text-wrap: balance; }
  .strip { display: grid; grid-template-columns: repeat(10, 1fr); }
  .strip button { padding: 0; border: 0; width: 100%; aspect-ratio: 1; cursor: pointer; }
  .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .strip button[aria-pressed="true"] { outline: 2px solid currentColor; outline-offset: -2px; }
  /* The score: a square as wide as a picture, the number in its middle */
  .score { aspect-ratio: 1; display: grid; place-items: center; font-weight: var(--bold); font-variant-numeric: tabular-nums; }
  /* A picture opened: a panel fixed to the bottom, with the prompt and the judge's answers */
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 70vh; overflow: auto; background: var(--paper);
    border-top: 1px solid currentColor; padding: var(--m) 1rem; transform: translateY(100%); transition: transform 0.2s ease-out; }
  .sheet.shown { transform: none; }
  .sheet-in { max-width: 84rem; margin: 0 auto; display: grid; grid-template-columns: 16rem 1fr auto; gap: var(--m); align-items: start; }
  .sheet img { width: 100%; display: block; }
  .sheet-text { display: grid; gap: var(--s); }
  .sheet ol { list-style: none; padding: 0; margin-top: var(--m); display: grid; gap: var(--s); font-variant-numeric: tabular-nums; }
  .sheet li { display: grid; grid-template-columns: 3.5rem 2.5rem 1fr; gap: var(--s); }
  .sheet li.no { opacity: var(--quiet); }
  .sheet .close { text-decoration: none; font-size: 1.5rem; line-height: 1; }
  body { padding-bottom: 50vh; } /* room to scroll the last rows above the panel */
  @media (max-width: 720px) {
    .model { grid-template-columns: 1fr 3rem; row-gap: var(--s); padding-top: var(--m); }
    .strip { grid-column: 1 / -1; grid-row: 2; grid-template-columns: repeat(5, 1fr); }
    .sheet-in { grid-template-columns: 1fr auto; }
    .sheet img { grid-column: 1 / -1; grid-row: 2; max-width: 16rem; }
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="quiet"><a href="/" data-text="back-class"></a></p>
    <h1 data-text="estonia-title"></h1>
    <p data-text="estonia-intro"></p>
    <p class="quiet" id="about"></p>
  </header>

  <section class="models" id="models"></section>
</main>
<aside class="sheet" id="sheet" aria-live="polite"><div class="sheet-in" id="sheet-in"></div></aside>
<script src="/text.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };

// The panel at the bottom: one picture, larger, with the prompt and the judge's answers.
let d = null;
function show(button, m, task, pic, src) {
  document.querySelectorAll('.strip button[aria-pressed="true"]').forEach((x) => x.setAttribute('aria-pressed', 'false'));
  button.setAttribute('aria-pressed', 'true');
  const answers = task.questions.map((q, j) => {
    const p = pic.answers[j];
    const yes = p != null && p >= d.cut;
    return el('li', { className: yes ? 'yes' : 'no' },
      el('span', { textContent: yes ? t('estonia-yes') : t('estonia-no') }),
      el('span', { textContent: p == null ? '' : p.toFixed(2) }),
      el('span', { textContent: q }));
  });
  const x = el('a', { href: '#', className: 'close', textContent: '×', title: t('estonia-close') });
  x.setAttribute('aria-label', t('estonia-close'));
  x.onclick = (e) => { e.preventDefault(); close(); };
  $('sheet-in').replaceChildren(
    el('img', { src, alt: t('estonia-alt', { model: m.name, thing: task.name }) }),
    el('div', { className: 'sheet-text' },
      el('h2', { textContent: t('estonia-picture', { thing: task.name, model: m.name, score: pic.score }) }),
      el('p', { className: 'quiet', textContent: task.prompt }),
      el('ol', {}, ...answers)),
    x);
  $('sheet').classList.add('shown');
}
function close() {
  $('sheet').classList.remove('shown');
  document.querySelectorAll('.strip button[aria-pressed="true"]').forEach((x) => x.setAttribute('aria-pressed', 'false'));
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

(async () => {
  await textReady;
  d = await (await fetch('/estonia/data.json')).json();
  $('about').textContent = t('estonia-about', { date: new Date(d.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) });

  for (const m of d.models) {
    const row = el('div', { className: 'model' });
    const who = el('div', { className: 'who' }, el('b', { textContent: m.name }), el('span', { className: 'quiet', textContent: m.maker }), el('span', { className: 'quiet', textContent: t('estonia-ran', { where: m.runs }) }));
    const strip = el('div', { className: 'strip' });
    const score = el('div', { className: 'score', textContent: m.score ?? '' });
    d.tasks.forEach((task, i) => {
      const pic = m.pictures[i];
      if (!pic) { strip.append(el('span')); return; }
      const src = `/estonia/${m.id}/${task.id}.jpg`;
      const b = el('button', { type: 'button', title: task.name }, el('img', { src, alt: t('estonia-alt', { model: m.name, thing: task.name }), loading: 'lazy' }));
      b.setAttribute('aria-pressed', 'false');
      b.onclick = () => (b.getAttribute('aria-pressed') === 'true' ? close() : show(b, m, task, pic, src));
      strip.append(b);
    });
    row.append(who, strip, score);
    $('models').append(row);
  }
})();
</script>
</body>
</html>
