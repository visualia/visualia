<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upscale · Visualia</title>
<link rel="stylesheet" href="/visualia.css">
<link rel="stylesheet" href="/pool.css">
<style>
  main { max-width: 64rem; }
  form { display: grid; gap: var(--m); justify-items: start; }
  form > table, form > label { justify-self: stretch; }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: var(--m); }
  figure { margin: 0; display: grid; gap: var(--s); }
  figure img { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<main>
  <header>
    <p class="quiet"><a href="/" data-text="back"></a></p>
    <h1 data-text="upscale-title"></h1>
    <p data-text="upscale-intro"></p>
  </header>

  <form id="form">
    <label><span data-text="upscale-pick"></span><input type="file" id="file" accept="image/png,image/jpeg,image/webp" required></label>
    <table class="pool models">
      <tbody>
        <tr><td class="pick"><input type="radio" name="model" value="pool/upscale-fast" id="m-fast" checked></td><td class="name"><label for="m-fast" data-text="upscale-name-fast"></label></td><td class="for quiet" data-text="upscale-for-fast"></td><td class="state quiet" data-text="upscale-where-pool"></td></tr>
        <tr><td class="pick"><input type="radio" name="model" value="pool/upscale-quality" id="m-quality"></td><td class="name"><label for="m-quality" data-text="upscale-name-detailed"></label></td><td class="for quiet" data-text="upscale-for-detailed"></td><td class="state quiet" data-text="upscale-where-pool"></td></tr>
        <tr><td class="pick"><input type="radio" name="model" value="@cf/black-forest-labs/flux-2-klein-9b" id="m-klein"></td><td class="name"><label for="m-klein" data-text="upscale-name-klein"></label></td><td class="for quiet" data-text="upscale-for-klein"></td><td class="state quiet" data-text="upscale-where-paid"></td></tr>
      </tbody>
    </table>
    <label id="instruction-box" hidden><span data-text="upscale-instruction"></span><textarea id="instruction" rows="4"></textarea></label>
    <button type="submit" id="go" data-text="upscale-go"></button>
  </form>

  <p class="quiet" id="status" aria-live="polite"></p>

  <section class="pair" id="result" hidden>
    <figure><figcaption class="quiet" data-text="upscale-before"></figcaption><img id="before" alt=""></figure>
    <figure><figcaption class="quiet"><span data-text="upscale-after"></span> · <a id="download" data-text="upscale-download"></a></figcaption><img id="after" alt=""></figure>
  </section>
</main>
<script src="/text.js"></script>
<script type="module">
await textReady;
const $ = (id) => document.getElementById(id);
const MAX = 640 * 640; // pixels the pool computers take (apps/pool-app/upscale MAX_PIXELS)
const KLEIN = '@cf/black-forest-labs/flux-2-klein-9b'; // takes pictures under 512x512 (apps/gateway redraw)
let shown = [];

// The instruction box is for klein 9B only (the other two take no words), filled with
// the gateway's own instruction (KLEIN_PROMPT); unchanged, nothing extra is sent.
const DEFAULT = t('upscale-instruction-default');
$('instruction').value = DEFAULT;
const picked = () => new FormData($('form')).get('model');
const toggle = () => { $('instruction-box').hidden = picked() !== KLEIN; };
document.querySelectorAll('input[name=model]').forEach((r) => r.addEventListener('change', toggle));
// A click anywhere on a row picks it, as on the pool's join page.
for (const tr of document.querySelectorAll('table.models tr:has(input)')) {
  tr.addEventListener('click', (e) => { if (!e.target.closest('input, label')) { tr.querySelector('input').click(); } });
}

// The picture as a PNG data URL, made smaller first when it is too big for the model.
async function prepare(file, model) {
  const img = await createImageBitmap(file);
  const k = model === KLEIN ? Math.min(1, 511 / Math.max(img.width, img.height)) : Math.min(1, Math.sqrt(MAX / (img.width * img.height)));
  const w = Math.floor(img.width * k), h = Math.floor(img.height * k);
  const canvas = Object.assign(document.createElement('canvas'), { width: w, height: h });
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  return { url: canvas.toDataURL('image/png'), w, h, shrunk: k < 1 };
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = $('file').files[0];
  if (!file) return;
  const model = new FormData($('form')).get('model');
  $('go').disabled = true;
  $('result').hidden = true;
  shown.forEach(URL.revokeObjectURL);
  shown = [];
  try {
    const pic = await prepare(file, model);
    const shrunk = pic.shrunk ? ' ' + t('upscale-shrunk', { w: pic.w, h: pic.h }) : '';
    $('status').textContent = t('upscale-working') + shrunk;
    const started = performance.now();
    const res = await fetch('/api/upscale', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ image: pic.url, model, ...(model === KLEIN && $('instruction').value.trim() !== DEFAULT ? { prompt: $('instruction').value } : {}) }),
    });
    const body = await res.json().catch(() => ({}));
    if (res.status === 503) throw new Error(t('upscale-none'));
    if (!body.data) throw new Error(t('upscale-failed', { why: body.detail ?? body.error ?? res.status }));
    const bytes = Uint8Array.from(atob(body.data[0].b64_json), (c) => c.charCodeAt(0));
    const after = URL.createObjectURL(new Blob([bytes], { type: 'image/jpeg' }));
    shown.push(after);
    $('before').src = pic.url;
    $('after').src = after;
    $('download').href = after;
    $('download').download = `${file.name.replace(/\.[^.]+$/, '')}-4x.jpg`;
    const [w, h] = body.size.split('x');
    const s = ((performance.now() - started) / 1000).toFixed(1);
    const j = body.usage?.energy_j;
    $('status').textContent = (body.served_by ? t('upscale-done', { w, h, s, who: body.served_by }) : t('upscale-done-paid', { w, h, s }))
      + (j != null ? ' ' + t('upscale-energy', { n: (j / 3600).toLocaleString('en', { maximumSignificantDigits: 2 }) }) : '') + shrunk;
    $('result').hidden = false;
  } catch (err) {
    $('status').textContent = err.message;
  } finally {
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
