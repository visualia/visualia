<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visualia</title>
<link rel="stylesheet" href="/visualia.css">
<style>
  html, body { height: 100%; }
  body { padding: 0; }
  .studio { display: grid; grid-template-columns: minmax(18rem, 28rem) 1fr; height: 100dvh; }
  .side { display: grid; grid-template-rows: auto 1fr auto; gap: var(--m); min-height: 0; padding: var(--m) var(--m) var(--m) 1.5rem; }
  .turns { display: grid; gap: var(--m); align-content: start; overflow-y: auto; overflow-wrap: anywhere; }
  .turn.page { cursor: pointer; }
  .turn.page.current { opacity: 1; }
  form.ask { display: grid; gap: var(--s); }
  .actions { display: flex; gap: var(--m); align-items: center; flex-wrap: wrap; }
  .links { display: grid; gap: 0.25rem; overflow-wrap: anywhere; }
  #problems { overflow-wrap: anywhere; }
  .preview { min-height: 0; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  .preview > p { display: none; }
  .phone { display: none; }
  /* A phone: the conversation is the page; the preview opens over it, full
     screen, and closing it leaves the conversation where it was. */
  @media (max-width: 640px) {
    .studio { grid-template-columns: 1fr; height: auto; }
    .side { padding: var(--m) 1rem; padding-bottom: max(var(--m), env(safe-area-inset-bottom)); grid-template-rows: none; }
    .turns { overflow: visible; }
    .phone { display: revert; }
    .preview { display: none; }
    .preview.open { display: grid; grid-template-rows: auto minmax(0, 1fr); position: fixed; inset: 0; z-index: 1; background: var(--paper); height: 100dvh; }
    .preview.open > p { display: flex; justify-content: space-between; gap: var(--m); padding: var(--s) 1rem; padding-top: max(var(--s), env(safe-area-inset-top)); }
    body.previewing { overflow: hidden; }
  }
</style>
</head>
<body>
<div class="studio">
  <div class="side">
    <header>
      <p class="quiet"><a href="/">Class</a></p>
      <h2 id="title"></h2>
      <p class="quiet" id="owner" hidden></p>
    </header>
    <div class="turns" id="turns"></div>
    <form class="ask" id="ask">
      <label for="text"><span id="prompt">Describe what you want to make</span><textarea id="text" required></textarea></label>
      <div class="actions">
        <button type="submit" id="send">Make it</button>
        <span class="quiet" id="status"></span>
      </div>
    </form>
    <div id="problems" hidden>
      <p>This version still has problems</p>
      <ul id="problem-list" class="quiet"></ul>
      <p><a href="#" id="fix">Fix them</a></p>
    </div>
    <div class="links">
      <a href="#preview" id="open-preview" class="phone" hidden>Preview</a>
      <a href="#" id="publish" hidden>Publish</a>
      <a href="#" id="share">Share in chat</a>
      <a id="url" class="quiet" target="_blank" rel="noopener"></a>
    </div>
  </div>
  <div class="preview" id="preview">
    <p><span class="quiet" id="preview-label"></span><a href="#" id="close-preview">Close</a></p>
    <iframe id="view" sandbox="allow-scripts" title="Preview"></iframe>
  </div>
</div>
<script type="module">
const id = location.pathname.split('/')[2];
const $ = (x) => document.getElementById(x);
let project = await (await fetch(`/api/projects/${id}`)).json();
const me = project.me, owner = project.person_id;
const asker = (t) => t.person ?? owner; // turns from before peers were the owner's
$('title').textContent = project.title;
if (owner !== me) { $('owner').hidden = false; $('owner').textContent = `by ${owner}`; }
document.title = `${project.title} · Visualia`;
showUrl(project.url);

let files = {}; // picture name -> data URL: the sandboxed preview has no cookie to fetch them with
let turns = [], current = 0, streaming = '', lastRender = 0, problems = [], autoFixes = 0, problemTimer;
const MODEL_NAMES = { 'deepseek-v4.1-flash-1017': 'DeepSeek V4.1 Flash', 'gemma-4-26b-a4b-it': 'Gemma 4', 'qwen3.8-27b': 'Qwen 3.8' };
const modelName = (m) => (m ? MODEL_NAMES[m.split('/').pop()] ?? m.split('/').pop() : '');

// The preview reports its own errors (failed library loads, script errors,
// console.error) to the studio, so students see them instead of a blank page.
const REPORTER = `<script>(function(){var s=function(m){parent.postMessage({visualiaError:String(m).slice(0,240)},'*')};
addEventListener('error',function(e){var t=e.target;if(t&&t!==window&&(t.src||t.href)){s('Could not load '+(t.src||t.href))}else{s(e.message)}},true);
addEventListener('unhandledrejection',function(e){s((e.reason&&e.reason.message)||e.reason)});
var ce=console.error;console.error=function(){s(Array.prototype.join.call(arguments,' '));ce.apply(console,arguments)};})();<\/script>`;
const withReporter = (html) => /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, (h) => h + REPORTER) : REPORTER + html;

addEventListener('message', (e) => {
  if (e.source !== $('view').contentWindow || !e.data?.visualiaError || streaming) return;
  if (problems.includes(e.data.visualiaError)) return;
  problems.push(e.data.visualiaError);
  // Wait a moment so all of a version's errors arrive together, then fix them
  // automatically; after two tries in a row, leave it to the student.
  clearTimeout(problemTimer);
  problemTimer = setTimeout(() => {
    // Only for whoever asked last: a peer just looking doesn't send fixes.
    const last = turns.filter((t) => t.role === 'user').pop();
    if (autoFixes < 2 && !$('send').disabled && last && asker(last) === me) { autoFixes++; sendFix(); return; }
    $('problem-list').innerHTML = problems.map((p) => `<li>${escape(p)}</li>`).join('');
    $('problems').hidden = false;
  }, 1500);
});

function sendFix() {
  ws.send(JSON.stringify({ type: 'ask', text: `Fix these errors in the page:\n${problems.map((p) => `- ${p}`).join('\n')}` }));
  $('problems').hidden = true;
}


const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/agents/studio-agent/${id}`);
ws.onmessage = async (e) => {
  let m; try { m = JSON.parse(e.data); } catch { return; }
  if (m.type === 'hello') {
    const first = !turns.length;
    turns = m.turns; drawTurns();
    if (m.versions) await showVersion(m.versions);
    setBusy(m.busy);
    if (first && phone()) window.scrollTo(0, document.body.scrollHeight); // the latest turn and the field
  } else if (m.type === 'start') {
    turns.push({ role: 'user', text: m.text, person: m.person }); drawTurns(); streaming = ''; setBusy(true, 'Thinking…');
  } else if (m.type === 'code') {
    setBusy(true, 'Writing the page…');
  } else if (m.type === 'images') {
    setBusy(true, 'Drawing pictures…');
  } else if (m.type === 'delta') {
    streaming += m.text;
    if (Date.now() - lastRender > 400) { render(inline(partial(streaming))); lastRender = Date.now(); }
  } else if (m.type === 'done') {
    turns.push({ role: 'page', version: m.version, model: m.model, person: m.person }); drawTurns();
    await showVersion(m.version); setBusy(false);
  } else if (m.type === 'check') {
    const t = turns.find((x) => x.role === 'page' && x.version === m.version);
    if (t) { t.fit = m.fit; drawTurns(); }
  } else if (m.type === 'error') {
    setBusy(false); $('status').textContent = m.text;
  } else if (m.type === 'busy') {
    $('status').textContent = 'Still working on the last request.';
  }
};
ws.onclose = () => { $('status').textContent = 'Disconnected. Reload the page.'; };

$('ask').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text) return;
  autoFixes = 0; // a student's own request starts a fresh fixing budget
  ws.send(JSON.stringify({ type: 'ask', text }));
  $('text').value = '';
});
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('ask').requestSubmit(); });

$('fix').addEventListener('click', (e) => { e.preventDefault(); autoFixes = 0; sendFix(); });

$('publish').addEventListener('click', async (e) => {
  e.preventDefault();
  const r = await fetch(`/api/projects/${id}/publish`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ version: current }) });
  const d = await r.json();
  if (r.ok) showUrl(d.url); else $('status').textContent = d.error;
});

async function showVersion(n) {
  const r = await fetch(`/api/projects/${id}/versions/${n}`);
  if (!r.ok) return;
  streaming = ''; problems = []; $('problems').hidden = true;
  current = n; render(withReporter(await withFiles(await r.text()))); drawTurns();
  $('publish').hidden = owner !== me; $('publish').textContent = `Publish version ${n}`; // publishing stays with the owner
  $('open-preview').hidden = false; $('open-preview').textContent = `Preview version ${n}`; $('preview-label').textContent = `Version ${n}`;
}

// ---- the preview on a phone: full screen, back closes it ------------------------
const phone = () => matchMedia('(max-width: 640px)').matches;
let scrollY = 0;
function openPreview() {
  if (!phone() || $('preview').classList.contains('open')) return;
  scrollY = window.scrollY;
  $('preview').classList.add('open'); document.body.classList.add('previewing');
  history.pushState({ preview: true }, '', '#preview');
}
function closePreview() {
  $('preview').classList.remove('open'); document.body.classList.remove('previewing');
  window.scrollTo(0, scrollY);
}
$('open-preview').addEventListener('click', (e) => { e.preventDefault(); openPreview(); });
$('close-preview').addEventListener('click', (e) => { e.preventDefault(); history.state?.preview ? history.back() : closePreview(); });
addEventListener('popstate', () => { if ($('preview').classList.contains('open')) closePreview(); });
if (location.hash === '#preview') history.replaceState(null, '', location.pathname);

$('share').addEventListener('click', (e) => { e.preventDefault(); location.href = `/?share=${id}`; });

function render(html) { if (html) $('view').srcdoc = html; }

// The page names its pictures relatively (1-1.jpg), which works where it's
// published; here they come in as data URLs.
async function withFiles(html) {
  const names = [...new Set([...html.matchAll(/src="(\d+-\d+\.jpg)"/g)].map((m) => m[1]))].filter((n) => !files[n]);
  await Promise.all(names.map(async (n) => {
    const r = await fetch(`/api/projects/${id}/files/${n}`);
    if (!r.ok) return;
    const blob = await r.blob();
    files[n] = await new Promise((done) => { const f = new FileReader(); f.onload = () => done(f.result); f.readAsDataURL(blob); });
  }));
  return inline(html);
}
const inline = (html) => html && html.replace(/src="(\d+-\d+\.jpg)"/g, (m, n) => (files[n] ? `src="${files[n]}"` : m));

// The page as far as it has been written: everything after ```html, or from
// the first tag if the model skipped the fence.
function partial(text) {
  const i = text.indexOf('```html');
  if (i >= 0) return text.slice(i + 7).split('```')[0];
  const j = text.search(/<!doctype|<html/i);
  return j >= 0 ? text.slice(j) : null;
}

function drawTurns() {
  $('turns').innerHTML = turns.map((t) => t.role === 'user'
    ? `<p>${asker(t) !== me ? `<span class="quiet">${escape(asker(t))}:</span> ` : ''}${t.text.startsWith('Fix these errors') ? '<span class="quiet">Fix errors</span>' : escape(t.text)}</p>`
    : `<p class="turn page quiet ${t.version === current ? 'current' : ''}" data-v="${t.version}">→ version ${t.version}${t.model ? ` · ${modelName(t.model)}` : ''}${typeof t.fit === 'number' ? ` · matches the request ${Math.round(t.fit * 100)}%` : ''}</p>`).join('');
  for (const el of document.querySelectorAll('.turn.page')) el.onclick = async () => { await showVersion(Number(el.dataset.v)); openPreview(); };
  $('prompt').textContent = turns.length ? 'What should change?' : 'Describe what you want to make';
  $('send').textContent = turns.length ? 'Change it' : 'Make it';
  $('turns').scrollTop = $('turns').scrollHeight;
}

function setBusy(busy, label = '') {
  $('send').disabled = busy; $('status').textContent = busy ? label || 'Working…' : '';
}

function showUrl(url) { if (url) { $('url').href = url; $('url').textContent = url.replace('https://', ''); } }

function escape(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
</script>
</body>
</html>
