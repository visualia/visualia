<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visualia</title>
<link rel="stylesheet" href="/visualia.css">
<style>
  html, body { height: 100%; }
  body { padding: 0; }
  .studio { display: grid; grid-template-columns: minmax(18rem, 28rem) 1fr; height: 100dvh; }
  .side { display: grid; grid-template-rows: auto 1fr auto; gap: var(--m); min-height: 0; padding: var(--m) var(--m) var(--m) 1.5rem; }
  .turns { display: grid; gap: var(--m); align-content: start; overflow-y: auto; overflow-wrap: anywhere; }
  .turn.page { cursor: pointer; }
  .turn.page.current { opacity: 1; }
  form.ask { display: grid; gap: var(--s); }
  .actions { display: flex; gap: var(--m); align-items: center; flex-wrap: wrap; }
  .links { display: grid; gap: 0.25rem; overflow-wrap: anywhere; }
  #problems { overflow-wrap: anywhere; }
  .preview { min-height: 0; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  .preview > p { display: none; }
  .phone { display: none; }
  /* A phone: the conversation is the page; the preview opens over it, full
     screen, and closing it leaves the conversation where it was. */
  @media (max-width: 640px) {
    .studio { grid-template-columns: 1fr; height: auto; }
    .side { padding: var(--m) 1rem; padding-bottom: max(var(--m), env(safe-area-inset-bottom)); grid-template-rows: none; }
    .turns { overflow: visible; }
    .phone { display: revert; }
    .preview { display: none; }
    .preview.open { display: grid; grid-template-rows: auto minmax(0, 1fr); position: fixed; inset: 0; z-index: 1; background: var(--paper); height: 100dvh; }
    .preview.open > p { display: flex; justify-content: space-between; gap: var(--m); padding: var(--s) 1rem; padding-top: max(var(--s), env(safe-area-inset-top)); }
    body.previewing { overflow: hidden; }
  }
</style>
</head>
<body>
<div class="studio">
  <div class="side">
    <header>
      <p class="quiet"><a href="/" data-text="back-class"></a></p>
      <h2 id="title"></h2>
      <p class="quiet" id="owner" hidden></p>
      <p class="quiet" id="from" hidden></p>
      <p class="quiet" id="remixes" hidden></p>
      <p id="visibility-line" hidden><a href="#" id="visibility"></a></p>
      <p id="kind-line" hidden><a href="#" id="to-files" data-text="to-files"></a></p>
      <p class="quiet" id="filelist" hidden></p>
    </header>
    <div class="turns" id="turns"></div>
    <form class="ask" id="ask">
      <label for="text"><span id="prompt" data-text="prompt-first"></span><textarea id="text" required></textarea></label>
      <div class="actions">
        <button type="submit" id="send" data-text="send-first"></button>
        <span class="quiet" id="status"></span>
      </div>
    </form>
    <div id="problems" hidden>
      <p data-text="problems"></p>
      <ul id="problem-list" class="quiet"></ul>
      <p><a href="#" id="fix" data-text="fix"></a></p>
    </div>
    <div class="links" id="links">
      <a href="#preview" id="open-preview" class="phone" hidden></a>
      <a href="#" id="publish" hidden></a>
      <a href="#" id="share" data-text="share-chat"></a>
      <a href="#" id="restore" hidden></a>
      <a href="#" id="remix" hidden data-text="remix"></a>
      <a id="url" class="quiet" target="_blank" rel="noopener"></a>
    </div>
  </div>
  <div class="preview" id="preview">
    <p><span class="quiet" id="preview-label"></span><a href="#" id="close-preview" data-text="close"></a></p>
    <iframe id="view" sandbox="allow-scripts" title="Preview"></iframe>
  </div>
</div>
<script src="/text.js"></script>
<script type="module">
await textReady;
const id = location.pathname.split('/')[2];
const $ = (x) => document.getElementById(x);
const res = await fetch(`/api/projects/${id}`);
if (!res.ok) { // someone else's private project, or none
  $('title').textContent = t('not-found');
  document.querySelector('.side').replaceChildren(document.querySelector('.side header')); $('preview').remove();
  throw new Error('not found');
}
let project = await res.json();
const me = project.me, owner = project.person_id;
// A multi-file project (kind 'files'): the preview loads its files from
// preview.visualia.space; a one-page project is the same with only index.html.
const multi = project.kind === 'files';
let preview = project.preview, versionBase = null, shown = 'index.html', latest = 0, live = {}, liveFile = null, liveOpen = false;
const asker = (t) => t.person ?? owner; // turns from before peers were the owner's
$('title').textContent = project.title;
if (owner !== me) { $('owner').hidden = false; $('owner').textContent = t('by', { person: owner }); }
// Credit: where a remix came from (linked when you may see it), and how often this was remixed into shared projects.
const who = (p) => (p === me ? t('you') : escape(p ?? t('someone')));
if (project.from) {
  const f = project.from;
  $('from').hidden = false;
  $('from').innerHTML = f.id ? t('from-project', { link: `<a href="/p/${f.id}">${escape(f.title)}</a>`, person: who(f.owner) }) : t('from-private', { person: who(f.owner) });
}
if (project.remixes) { $('remixes').hidden = false; $('remixes').textContent = project.remixes === 1 ? t('remixed-once') : t('remixed-n', { n: project.remixes }); }

// Remix: a private copy of this version of the page for you to change; it stays linked to this one.
$('remix').hidden = !project.versions;
$('remix').addEventListener('click', async (e) => {
  e.preventDefault();
  const r = await fetch(`/api/projects/${id}/remix`, { method: 'POST' });
  const d = await r.json();
  if (r.ok) location.href = `/p/${d.id}`; else $('status').textContent = d.error;
});
document.title = `${project.title} · ${t('app-name')}`;
showUrl(project.url);

// The owner decides who sees the project: only them, or the class.
function showVisibility() {
  $('visibility-line').hidden = owner !== me;
  $('visibility').textContent = project.visibility === 'class' ? t('make-private') : t('share-class');
  $('share').hidden = project.visibility !== 'class'; // the chat is the class's
}
showVisibility();
$('visibility').addEventListener('click', async (e) => {
  e.preventDefault();
  const visibility = project.visibility === 'class' ? 'private' : 'class';
  const r = await fetch(`/api/projects/${id}/visibility`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ visibility }) });
  if (r.ok) { project.visibility = visibility; showVisibility(); } else $('status').textContent = (await r.json()).error;
  // the preview's links are signed with the visibility
  if (r.ok && multi) { preview = (await (await fetch(`/api/projects/${id}`)).json()).preview; if (current) await showVersion(current); }
});

$('kind-line').hidden = multi || owner !== me;
$('to-files').addEventListener('click', async (e) => {
  e.preventDefault();
  const r = await fetch(`/api/projects/${id}/kind`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind: 'files' }) });
  if (r.ok) location.reload(); else $('status').textContent = (await r.json()).error;
});
$('restore').addEventListener('click', (e) => { e.preventDefault(); send({ type: 'restore', version: current }); });

let files = {}; // picture name -> data URL: the sandboxed preview has no cookie to fetch them with
let turns = [], current = 0, streaming = '', lastRender = 0, problems = [], autoFixes = 0, problemTimer;
// Model names people read are in text.json as model-<id>; an unknown model shows its id.
const modelName = (m) => { if (!m) return ''; const id = m.split('/').pop(); const name = t(`model-${id}`); return name === `model-${id}` ? id : name; };

// The preview reports its own errors (failed library loads, script errors,
// console.error) to the studio, so students see them instead of a blank page.
const REPORTER = `<script>(function(){var s=function(m){parent.postMessage({visualiaError:String(m).slice(0,240)},'*')};
addEventListener('error',function(e){var t=e.target;if(t&&t!==window&&(t.src||t.href)){s('Could not load '+(t.src||t.href))}else{s(e.message)}},true);
addEventListener('unhandledrejection',function(e){s((e.reason&&e.reason.message)||e.reason)});
var ce=console.error;console.error=function(){s(Array.prototype.join.call(arguments,' '));ce.apply(console,arguments)};})();<\/script>`;
const withReporter = (html) => /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, (h) => h + REPORTER) : REPORTER + html;

addEventListener('message', (e) => {
  if (e.source !== $('view').contentWindow || !e.data?.visualiaError || streaming) return;
  addProblem(e.data.visualiaError);
});

function addProblem(text) {
  if (problems.includes(text)) return;
  problems.push(text);
  // Wait a moment so all of a version's errors arrive together, then fix them
  // automatically; after two tries in a row, leave it to the student.
  clearTimeout(problemTimer);
  problemTimer = setTimeout(() => {
    // Only for whoever asked last: a peer just looking doesn't send fixes.
    const last = turns.filter((t) => t.role === 'user').pop();
    if (autoFixes < 2 && !$('send').disabled && last && asker(last) === me) { autoFixes++; sendFix(); return; }
    $('problem-list').innerHTML = problems.map((p) => `<li>${escape(p)}</li>`).join('');
    $('problems').hidden = false;
  }, 1500);
}

function sendFix() {
  send({ type: 'ask', text: `Fix these errors in the page:\n${problems.map((p) => `- ${p}`).join('\n')}` });
  $('problems').hidden = true;
}


const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/agents/studio-agent/${id}`);
ws.onmessage = async (e) => {
  let m; try { m = JSON.parse(e.data); } catch { return; }
  if (m.type === 'hello') {
    const first = !turns.length;
    turns = m.turns; latest = m.versions; drawTurns();
    if (m.files) drawFiles(m.files);
    if (m.versions) await showVersion(m.versions);
    setBusy(m.busy);
    if (first && phone()) window.scrollTo(0, document.body.scrollHeight); // the latest turn and the field
  } else if (m.type === 'start') {
    turns.push({ role: 'user', text: m.text, person: m.person }); drawTurns(); streaming = multi ? 'files' : ''; setBusy(true, t('busy-thinking'));
    live = {}; liveFile = null; liveOpen = false;
  } else if (m.type === 'tool') {
    const doing = { write: t('busy-writing-file', { path: m.path }), edit: t('busy-changing-file', { path: m.path }), delete: t('busy-deleting-file', { path: m.path }), read: t('busy-reading-file', { path: m.path }) }[m.name];
    if (m.path && doing) setBusy(true, doing);
  } else if (m.type === 'file-delta') {
    // An HTML file as it's written, its CSS, JS and pictures from the working copy.
    // The turn's first page is shown as it's written.
    live[m.path] = (live[m.path] ?? '') + m.text;
    if (!liveFile && /\.html?$/i.test(m.path)) { liveFile = m.path; liveOpen = true; }
    if (m.path === liveFile && liveOpen && Date.now() - lastRender > 400) { render(withBase(live[m.path])); lastRender = Date.now(); }
  } else if (m.type === 'tool-done') {
    if (m.error || !m.path) return;
    if (m.path === liveFile) { liveOpen = false; shown = m.path; }
    if (liveOpen) render(withBase(live[liveFile])); // that page isn't saved yet: its new CSS or JS comes in with it
    else show(`${preview}${shown}?r=${Date.now()}`); // the working copy, reloaded
  } else if (m.type === 'code') {
    setBusy(true, t('busy-writing-page'));
  } else if (m.type === 'images') {
    setBusy(true, t('busy-pictures'));
  } else if (m.type === 'delta') {
    streaming += m.text;
    if (Date.now() - lastRender > 400) { render(inline(partial(streaming))); lastRender = Date.now(); }
  } else if (m.type === 'done') {
    turns.push({ role: 'page', version: m.version, model: m.model, person: m.person, restored: m.restored }); latest = m.version; drawTurns();
    if (m.files) drawFiles(m.files);
    await showVersion(m.version); setBusy(false);
    for (const p of m.problems ?? []) addProblem(p); // links from the site's root: "Fix them" and auto-fix as for errors
  } else if (m.type === 'kind') {
    location.reload();
  } else if (m.type === 'check') {
    const t = turns.find((x) => x.role === 'page' && x.version === m.version);
    if (t) { t.fit = m.fit; drawTurns(); }
  } else if (m.type === 'error') {
    setBusy(false); $('status').textContent = m.text;
  } else if (m.type === 'private') {
    revoke();
  } else if (m.type === 'busy') {
    $('status').textContent = t('still-working');
  }
};
// The owner made the project private: what was on screen goes too.
let revoked = false;
function revoke() {
  revoked = true; turns = []; drawTurns(); $('view').srcdoc = ''; $('links').remove();
  $('ask').replaceChildren($('status')); $('status').textContent = t('made-private');
}
// Before the connection is open (just after loading) nothing is sent: say so.
function send(m) {
  if (ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify(m)); return true; }
  $('status').textContent = ws.readyState === WebSocket.CONNECTING ? t('connecting') : t('disconnected');
  return false;
}
ws.onclose = (e) => {
  if (e.code === 4003) { if (!revoked) revoke(); return; }
  $('status').textContent = t('disconnected');
};

$('ask').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text) return;
  if (!send({ type: 'ask', text })) return; // the text stays in the field
  autoFixes = 0; // a student's own request starts a fresh fixing budget
  $('text').value = '';
});
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('ask').requestSubmit(); });

$('fix').addEventListener('click', (e) => { e.preventDefault(); autoFixes = 0; sendFix(); });

$('publish').addEventListener('click', async (e) => {
  e.preventDefault();
  const r = await fetch(`/api/projects/${id}/publish`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ version: current }) });
  const d = await r.json();
  if (r.ok) showUrl(d.url); else $('status').textContent = d.error;
});

async function showVersion(n) {
  const r = await fetch(`/api/projects/${id}/versions/${n}`);
  if (!r.ok) return;
  streaming = ''; problems = []; $('problems').hidden = true;
  current = n;
  if (r.headers.get('content-type')?.includes('json')) { // a multi-file version: by URL
    const v = await r.json();
    versionBase = v.preview; drawFiles(Object.entries(v.files).map(([path, f]) => ({ path, size: f.size })));
    if (!v.files[shown]) shown = 'index.html';
    show(versionBase + shown);
  } else { versionBase = null; render(withReporter(await withFiles(await r.text()))); }
  drawTurns();
  $('restore').hidden = !multi || n === latest; $('restore').textContent = t('restore', { n });
  $('publish').hidden = owner !== me; $('publish').textContent = t('publish', { n }); // publishing stays with the owner
  $('remix').hidden = false;
  $('open-preview').hidden = false; $('open-preview').textContent = t('preview', { n }); $('preview-label').textContent = t('version', { n });
}

// ---- the preview on a phone: full screen, back closes it ------------------------
const phone = () => matchMedia('(max-width: 640px)').matches;
let scrollY = 0;
function openPreview() {
  if (!phone() || $('preview').classList.contains('open')) return;
  scrollY = window.scrollY;
  $('preview').classList.add('open'); document.body.classList.add('previewing');
  history.pushState({ preview: true }, '', '#preview');
}
function closePreview() {
  $('preview').classList.remove('open'); document.body.classList.remove('previewing');
  window.scrollTo(0, scrollY);
}
$('open-preview').addEventListener('click', (e) => { e.preventDefault(); openPreview(); });
$('close-preview').addEventListener('click', (e) => { e.preventDefault(); history.state?.preview ? history.back() : closePreview(); });
addEventListener('popstate', () => { if ($('preview').classList.contains('open')) closePreview(); });
if (location.hash === '#preview') history.replaceState(null, '', location.pathname);

$('share').addEventListener('click', (e) => { e.preventDefault(); location.href = `/?share=${id}`; });

function render(html) { if (html) $('view').srcdoc = html; }
function show(url) { $('view').removeAttribute('srcdoc'); $('view').src = url; }
// A page being written, loading its other files from the working copy.
const withBase = (html) => { const b = `<base href="${preview}">`; return /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, (h) => h + b) : b + html; };

// The files of the version on screen; a click shows one in the preview.
function drawFiles(list) {
  $('filelist').hidden = !multi;
  $('filelist').innerHTML = list.map((f) => `<a href="#" data-path="${escape(f.path)}">${escape(f.path)}</a>`).join(' · ');
  for (const a of $('filelist').querySelectorAll('a')) a.onclick = (e) => { e.preventDefault(); shown = a.dataset.path; show((versionBase ?? preview) + shown); openPreview(); };
}

// The page names its pictures relatively (1-1.jpg), which works where it's
// published; here they come in as data URLs.
async function withFiles(html) {
  const names = [...new Set([...html.matchAll(/src="(\d+-\d+\.jpg)"/g)].map((m) => m[1]))].filter((n) => !files[n]);
  await Promise.all(names.map(async (n) => {
    const r = await fetch(`/api/projects/${id}/files/${n}`);
    if (!r.ok) return;
    const blob = await r.blob();
    files[n] = await new Promise((done) => { const f = new FileReader(); f.onload = () => done(f.result); f.readAsDataURL(blob); });
  }));
  return inline(html);
}
const inline = (html) => html && html.replace(/src="(\d+-\d+\.jpg)"/g, (m, n) => (files[n] ? `src="${files[n]}"` : m));

// The page as far as it has been written: everything after ```html, or from
// the first tag if the model skipped the fence.
function partial(text) {
  const i = text.indexOf('```html');
  if (i >= 0) return text.slice(i + 7).split('```')[0];
  const j = text.search(/<!doctype|<html/i);
  return j >= 0 ? text.slice(j) : null;
}

function drawTurns() {
  $('turns').innerHTML = turns.map((turn) => turn.role === 'user'
    ? `<p>${asker(turn) !== me ? `<span class="quiet">${escape(asker(turn))}:</span> ` : ''}${turn.text.startsWith('Fix these errors') ? `<span class="quiet">${t('fix-errors')}</span>` : escape(turn.text)}</p>`
    : `<p class="turn page quiet ${turn.version === current ? 'current' : ''}" data-v="${turn.version}">${[
      t('turn-version', { n: turn.version }),
      turn.from && t('turn-remixed'),
      turn.restored && t('turn-back-to', { n: turn.restored }),
      turn.model && modelName(turn.model),
      typeof turn.fit === 'number' && t('turn-fit', { pct: Math.round(turn.fit * 100) }),
    ].filter(Boolean).join(' · ')}</p>`).join('');
  for (const el of document.querySelectorAll('.turn.page')) el.onclick = async () => { await showVersion(Number(el.dataset.v)); openPreview(); };
  $('prompt').textContent = turns.length ? t('prompt-change') : t('prompt-first');
  $('send').textContent = turns.length ? t('send-change') : t('send-first');
  $('turns').scrollTop = $('turns').scrollHeight;
}

function setBusy(busy, label = '') {
  $('send').disabled = busy; $('status').textContent = busy ? label || t('busy-working') : '';
}

function showUrl(url) { if (url) { $('url').href = url; $('url').textContent = url.replace('https://', ''); } }

function escape(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
</script>
</body>
</html>
