<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage · Visualia</title>
<link rel="stylesheet" href="/visualia.css">
<style>
  main { max-width: 52rem; }
  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: var(--m) var(--l); }
  .totals div { display: grid; gap: 0.15rem; }
  .big { font-size: var(--large); font-weight: var(--bold); line-height: 1; font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 400; opacity: var(--quiet); padding: 0 var(--m) var(--s) 0; }
  td { padding: 0.35rem var(--m) 0.35rem 0; vertical-align: top; }
  th.n, td.n { text-align: right; }
  tr.failed td { opacity: var(--quiet); }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <header>
    <p class="quiet"><a href="/" data-text="back-class"></a></p>
    <h1 data-text="usage-title"></h1>
  </header>

  <section class="totals" id="totals"></section>

  <section>
    <h2 data-text="usage-people"></h2>
    <div class="scroll"><table id="people"></table></div>
  </section>

  <section>
    <h2 data-text="usage-models"></h2>
    <div class="scroll"><table id="models"></table></div>
  </section>

  <section>
    <h2 data-text="usage-latest"></h2>
    <div class="scroll"><table id="recent"></table></div>
  </section>

</main>
<script src="/text.js"></script>
<script type="module">
await textReady;
const d = await (await fetch('/api/usage')).json();
const $ = (id) => document.getElementById(id);
const money = (x) => (x == null ? '–' : x < 0.01 ? `$${x.toFixed(4)}` : `$${x.toFixed(2)}`);
const num = (x) => (x ?? 0).toLocaleString('en');
const tokens = (r) => num((r.tokens_in ?? 0) + (r.tokens_out ?? 0));

$('totals').innerHTML = [[t('usage-today'), d.today], [t('usage-week'), d.week], [t('usage-all'), d.all]].map(([k, r]) => `
  <div><span class="quiet">${k}</span><span class="big">${money(r.cost)}</span>
  <span class="quiet">${t('usage-calls', { calls: num(r.calls), tokens: tokens(r) })}${r.failed ? ` · ${t('usage-failed-n', { n: r.failed })}` : ''}</span></div>`).join('');

const table = (rows, cols) => `<tr>${cols.map(([h, , n]) => `<th class="${n ? 'n' : ''}">${h}</th>`).join('')}</tr>` +
  rows.map((r) => `<tr class="${r.ok === 0 ? 'failed' : ''}">${cols.map(([, f, n]) => `<td class="${n ? 'n' : ''}">${f(r)}</td>`).join('')}</tr>`).join('');

$('people').innerHTML = table(d.people, [[t('col-person'), (r) => r.name], [t('col-calls'), (r) => num(r.calls), 1], [t('col-tokens'), tokens, 1], [t('col-cost'), (r) => money(r.cost), 1]]);
$('models').innerHTML = table(d.models, [[t('col-model'), (r) => r.name.split('/').pop()], [t('col-calls'), (r) => num(r.calls), 1], [t('col-tokens'), tokens, 1], [t('col-avg-time'), (r) => t('seconds', { s: (r.ms / 1000).toFixed(1) }), 1], [t('col-cost'), (r) => money(r.cost), 1]]);
$('recent').innerHTML = table(d.recent, [
  [t('col-when'), (r) => new Date(r.ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })],
  [t('col-who'), (r) => r.person_id],
  [t('col-project'), (r) => r.title ?? '–'],
  [t('col-model'), (r) => r.model.split('/').pop()],
  [t('col-served-by'), (r) => r.served_by ?? ''], // pool rows: whose computer did the work
  [t('col-tokens'), tokens, 1],
  [t('col-time'), (r) => t('seconds', { s: (r.latency_ms / 1000).toFixed(1) }), 1],
  [t('col-cost'), (r) => (r.ok === 0 ? (r.error ?? t('usage-failed')).slice(0, 24) : money(r.cost_usd)), 1],
]);
</script>
</body>
</html>
