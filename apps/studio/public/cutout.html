<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remove background · Visualia</title>
<link rel="stylesheet" href="/visualia.css">
<link rel="stylesheet" href="/pool.css">
<style>
  main { max-width: 64rem; }
  form { display: grid; gap: var(--m); justify-items: start; }
  form > table, form > label { justify-self: stretch; }
  .row-left { display: flex; align-items: center; gap: var(--m); }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: var(--m); }
  figure { margin: 0; display: grid; gap: var(--s); }
  figure img { width: 100%; height: auto; display: block; }
  /* a checkerboard behind the cut-out, so the removed part shows */
  .checker { background: repeating-conic-gradient(color-mix(in srgb, currentColor 12%, transparent) 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
</style>
</head>
<body>
<main>
  <header>
    <p class="quiet"><a href="/" data-text="back"></a></p>
    <h1 data-text="cutout-title"></h1>
    <p data-text="cutout-intro"></p>
  </header>

  <form id="form">
    <label><span data-text="upscale-pick"></span><input type="file" id="file" accept="image/png,image/jpeg,image/webp" required></label>
    <p class="row-left"><button type="submit" id="go" data-text="cutout-go"></button><span id="elapsed" class="quiet"></span></p>
  </form>

  <p class="quiet" id="status" aria-live="polite"></p>

  <section class="pair" id="result" hidden>
    <figure><figcaption class="quiet" data-text="upscale-before"></figcaption><img id="before" alt=""></figure>
    <figure><figcaption class="quiet"><span data-text="upscale-after"></span> · <a id="download" data-text="upscale-download"></a></figcaption><img id="after" class="checker" alt=""></figure>
  </section>
</main>
<script src="/text.js"></script>
<script type="module">
await textReady;
const $ = (id) => document.getElementById(id);
const MAX = 1024; // the long side sent (plans/pool-3d.md: the mask model looks at 1024 x 1024)
const USUAL = 8;  // seconds, cold, on the M1 (research/triposr-node.md); the button fills towards it
let shown = [], ticking = null;

function fill() {
  const t0 = performance.now();
  $('go').classList.add('progress');
  ticking = setInterval(() => {
    const s = (performance.now() - t0) / 1000;
    $('go').style.setProperty('--progress', `${Math.round(95 * (1 - Math.exp(-s / USUAL)))}%`);
    $('elapsed').textContent = t('upscale-seconds', { s: Math.floor(s) });
  }, 200);
}
function unfill() {
  clearInterval(ticking);
  $('go').classList.remove('progress');
  $('go').style.removeProperty('--progress');
  $('elapsed').textContent = '';
}

// The picture as a PNG data URL, at most MAX pixels on its long side.
async function prepare(file) {
  const img = await createImageBitmap(file);
  const k = Math.min(1, MAX / Math.max(img.width, img.height));
  const w = Math.round(img.width * k), h = Math.round(img.height * k);
  const canvas = Object.assign(document.createElement('canvas'), { width: w, height: h });
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  return { url: canvas.toDataURL('image/png'), w, h, shrunk: k < 1 };
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = $('file').files[0];
  if (!file) return;
  $('go').disabled = true;
  $('result').hidden = true;
  shown.forEach(URL.revokeObjectURL);
  shown = [];
  try {
    const pic = await prepare(file);
    const shrunk = pic.shrunk ? ' ' + t('upscale-shrunk', { w: pic.w, h: pic.h }) : '';
    $('status').textContent = t('cutout-working') + shrunk;
    fill();
    const started = performance.now();
    const res = await fetch('/api/cutout', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ image: pic.url }) });
    const body = await res.json().catch(() => ({}));
    if (res.status === 503) throw new Error(t('cutout-none'));
    if (!body.data) throw new Error(t('cutout-failed', { why: body.detail ?? body.error ?? res.status }));
    const bytes = Uint8Array.from(atob(body.data[0].b64_json), (c) => c.charCodeAt(0));
    const after = URL.createObjectURL(new Blob([bytes], { type: 'image/png' }));
    shown.push(after);
    $('before').src = pic.url;
    $('after').src = after;
    $('download').href = after;
    $('download').download = `${file.name.replace(/\.[^.]+$/, '')}-cutout.png`;
    const [w, h] = body.size.split('x');
    const s = ((performance.now() - started) / 1000).toFixed(1);
    const j = body.usage?.energy_j;
    $('status').textContent = t('upscale-done', { w, h, s, who: body.served_by })
      + (j != null ? ' ' + t('upscale-energy', { n: (j / 3600).toLocaleString('en', { maximumSignificantDigits: 2 }) }) : '') + shrunk;
    $('result').hidden = false;
  } catch (err) {
    $('status').textContent = err.message;
  } finally {
    unfill();
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
