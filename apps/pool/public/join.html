<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-text="page-title">Join the pool</title>
<link rel="stylesheet" href="/visualia.css">
<style>
  /* layout only; the look comes from visualia.css */
  /* Work done: one row per piece of work, numbers right-aligned under their unit (as in the Visualia Pool app) */
  #jobs { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  #jobs th { font-weight: inherit; text-align: left; }
  #jobs th, #jobs td { padding: 0 0 var(--s) var(--m); vertical-align: baseline; white-space: nowrap; }
  #jobs :is(th, td):first-child { padding-left: 0; }
  #jobs :is(th, td):nth-child(2) { width: 100%; padding-left: var(--s); } /* the model takes what's left */
  #jobs :is(th, td):nth-child(n+3) { text-align: right; }
  #jobs tr.running { font-weight: var(--bold); }
  /* A phone: the clock goes (rows are newest first), the gaps get smaller. */
  @media (max-width: 440px) {
    #jobs :is(th, td):first-child { display: none; }
    #jobs :is(th, td):nth-child(2) { padding-left: 0; }
    #jobs th, #jobs td { padding-left: var(--s); }
  }
  .buttons { display: flex; flex-wrap: wrap; gap: var(--s); }
  ul { padding-left: 1.2em; display: grid; gap: var(--s); }
  code { font: inherit; }
  .choice { grid-template-columns: auto 1fr; align-items: baseline; gap: 0 var(--s); }
  .choice > span { opacity: 1; }
  .choice input[type=radio] { width: auto; }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-text="title"></h1>
    <p data-text="intro"></p>
  </header>

  <!-- signed out -->
  <form id="signin" method="post" action="/login" hidden>
    <section>
      <label for="key"><span data-text="key-label"></span><input id="key" name="key" type="password" autocomplete="off" spellcheck="false" placeholder="ABCD-EFGH" required></label>
      <p id="wrong" class="bold" hidden data-text="key-wrong"></p>
      <p><button type="submit" data-text="sign-in"></button></p>
    </section>
  </form>

  <!-- signed in -->
  <section id="share" hidden>
    <p class="bold" data-text="share-note"></p>
    <label class="choice"><input type="radio" name="model" value="qwen2.5-1.5b" checked>
      <span data-html="model-small"></span></label>
    <label class="choice"><input type="radio" name="model" value="qwen3-4b">
      <span data-html="model-strong"></span></label>
    <label class="choice"><input type="radio" name="model" value="qwen3.5-9b">
      <span data-html="model-largest"></span></label>
    <label class="choice"><input type="radio" name="model" value="none">
      <span data-html="model-none"></span></label>
    <label class="choice"><input type="checkbox" id="upscale" checked>
      <span data-html="upscale-choice"></span></label>
    <p id="hint" class="quiet"></p>
    <dl>
      <dt data-text="download"></dt><dd data-text="download-once"></dd>
      <dt data-text="signed-in-as"></dt><dd id="me"></dd>
    </dl>
    <p id="status" class="quiet"></p>
    <div class="buttons">
      <button id="start" type="button" data-text="join"></button>
      <button id="stop" type="button" hidden data-text="leave"></button>
    </div>
  </section>

  <section id="jobs-section" hidden>
    <h2 data-text="work-done"></h2>
    <table id="jobs">
      <thead class="quiet"><tr><th data-text="col-time"></th><th data-text="col-model"></th><th data-text="col-tokens"></th><th data-text="col-seconds"></th></tr></thead>
      <tbody id="job-rows"></tbody>
    </table>
  </section>

  <section>
    <h2 data-text="does-title"></h2>
    <ul>
      <li data-text="does-run"></li>
      <li data-html="does-answer"></li>
      <li data-html="does-upscale"></li>
      <li data-text="does-list"></li>
      <li data-text="does-usage"></li>
      <li data-text="does-one"></li>
    </ul>
  </section>

  <section>
    <h2 data-text="never-title"></h2>
    <ul>
      <li data-text="never-files"></li>
      <li data-text="never-keep"></li>
      <li data-text="never-who"></li>
      <li data-text="never-learn"></li>
      <li data-text="never-background"></li>
      <li data-text="never-incoming"></li>
    </ul>
  </section>

  <section>
    <h2 data-text="addresses-title"></h2>
    <dl>
      <dt data-text="addr-pool"></dt><dd data-text="addr-pool-why"></dd>
      <dt data-text="addr-cdn"></dt><dd data-text="addr-cdn-why"></dd>
      <dt data-text="addr-hf"></dt><dd data-text="addr-hf-why"></dd>
      <dt data-text="addr-gh"></dt><dd data-text="addr-gh-why"></dd>
    </dl>
    <p class="quiet" data-text="addresses-note"></p>
  </section>

  <section>
    <h2 data-text="stores-title"></h2>
    <ul>
      <li data-text="stores-what"></li>
      <li data-text="stores-stop"></li>
      <li><span data-text="stores-remove"></span> <button id="remove" type="button" data-text="remove"></button></li>
      <li data-html="stores-block"></li>
    </ul>
    <p class="quiet" data-html="code"></p>
  </section>

  <form id="signout" method="post" action="/logout" hidden><button type="submit" data-text="sign-out"></button></form>
</main>

<script src="/text.js"></script>

<script type="module">
const WEBLLM = 'https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.86/+esm';
// The pool's names: requests for pool/<name> come to a tab that loaded it.
const MODELS = {
  'qwen2.5-1.5b': { id: (q) => `Qwen2.5-1.5B-Instruct-${q}-MLC` },
  'qwen3-4b': { id: (q) => `Qwen3-4B-${q}-MLC`, noThinking: true },
  // The same model the desktop workers serve; in a tab only short jobs come
  // here (the Pool's TAB limits: a tab has a 4,096-token context).
  'qwen3.5-9b': { id: (q) => `Qwen3.5-9B-${q}-MLC`, noThinking: true },
};
const $ = (id) => document.getElementById(id);

// The upscaler (apps/pool-app/upscale, WebAssembly + WebGPU): its weights come
// from the pool's model list, checked by SHA-256, kept in Cache Storage.
const UPSCALER = 'upscale-fast';
const UPSCALE_MAX = 640 * 640; // pixels, as in the app
let upscaler = null;   // the loaded upscaler, when ticked

let engine = null;     // the loaded model
let loaded = null;     // its pool name
let ws = null;         // the connection to the pool
let sharing = false;
let retry = 0;
let queue = Promise.resolve(); // one job at a time
const cancelled = new Set();
const chosen = () => document.querySelector('input[name=model]:checked').value;

await textReady;
const me = await fetch('/me').then((r) => (r.ok ? r.json() : null)).catch(() => null);
if (!me) {
  $('signin').hidden = false;
  if (location.search.includes('wrong')) $('wrong').hidden = false;
} else {
  $('share').hidden = false;
  $('signout').hidden = false;
  $('me').textContent = t('me', { person: me.person, group: me.school });
  if (!navigator.gpu) {
    status(t('no-webgpu'));
    $('start').disabled = true;
  } else {
    status(t('not-in-pool'));
    hint();
  }
}
$('start').addEventListener('click', start);
$('stop').addEventListener('click', stop);
$('remove').addEventListener('click', removeModels);
// Switching while in the pool: unload one, load the other.
document.querySelectorAll('input[name=model]').forEach((r) => r.addEventListener('change', async () => {
  if (sharing && chosen() !== (loaded ?? 'none')) { await stop(); start(); }
}));

function status(t) { $('status').textContent = t; }

// A suggestion only: the graphics chip's maker, 16-bit shaders and the largest
// buffer it allows. Browsers don't tell a page how much memory there is.
async function hint() {
  const adapter = await navigator.gpu.requestAdapter().catch(() => null);
  if (!adapter) return;
  const { vendor = '', architecture = '' } = adapter.info ?? {};
  const big = adapter.limits.maxBufferSize >= 2 ** 31;
  const strong = /apple|nvidia/i.test(vendor) && adapter.features.has('shader-f16') && big;
  const chip = [vendor, architecture].filter(Boolean).join(' ') || t('chip-unknown');
  $('hint').textContent = strong ? t('hint-strong', { chip }) : t('hint-weak', { chip });
}

// q4f16 needs 16-bit shaders; older graphics only have 32-bit.
async function modelId(name) {
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error('no WebGPU adapter');
  return MODELS[name].id(adapter.features.has('shader-f16') ? 'q4f16_1' : 'q4f32_1');
}

// New downloads go to IndexedDB: Cache Storage refused a 254 MB file in the
// study (research/browser-models.md). A model already in Cache Storage stays there.
async function appConfig(webllm, id) {
  const inCache = await webllm.hasModelInCache(id, { ...webllm.prebuiltAppConfig, cacheBackend: 'cache' }).catch(() => false);
  return { ...webllm.prebuiltAppConfig, cacheBackend: inCache ? 'cache' : 'indexeddb' };
}

async function start() {
  $('start').disabled = true;
  try {
    const name = chosen();
    if (name === 'none' && !$('upscale').checked) throw new Error(t('nothing-chosen'));
    if (!engine && name !== 'none') {
      status(t('starting'));
      const webllm = await import(WEBLLM);
      const id = await modelId(name);
      engine = await webllm.CreateMLCEngine(id, {
        appConfig: await appConfig(webllm, id),
        initProgressCallback: ({ progress, text }) => {
          const pct = Math.floor((progress ?? 0) * 100);
          status(/fetch|download/i.test(text ?? '') ? t('downloading', { percent: pct }) : t('loading', { percent: pct }));
        },
      });
      loaded = name;
    }
    if ($('upscale').checked && !upscaler) upscaler = await loadUpscaler();
    sharing = true;
    $('start').hidden = true;
    $('stop').hidden = false;
    $('jobs-section').hidden = false;
    connect();
  } catch (e) {
    console.warn('could not start', e);
    try { await engine?.unload(); } catch {}
    engine = null;
    status(t('cant-start', { error: String(e?.message ?? e).slice(0, 160) }));
    $('start').disabled = false;
  }
}

async function stop() {
  sharing = false;
  ws?.close(1000, 'stopped');
  ws = null;
  try { engine?.interruptGenerate(); } catch {}
  try { await engine?.unload(); } catch {}
  engine = null;
  loaded = null;
  upscaler?.free();
  upscaler = null;
  $('stop').hidden = true;
  $('start').hidden = false;
  $('start').disabled = false;
  status(t('not-in-pool'));
}

function connect() {
  if (!sharing) return;
  status(t('connecting'));
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/connect`); // ws only in local tests
  const sock = ws;
  let ping;
  sock.onopen = () => {
    retry = 0;
    sock.send(JSON.stringify({ type: 'hello', models: [loaded, upscaler && UPSCALER].filter(Boolean) }));
    ping = setInterval(() => sock.readyState === 1 && sock.send('ping'), 25_000);
  };
  sock.onmessage = (e) => {
    if (e.data === 'pong') return;
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    const offered = [loaded, upscaler && UPSCALER].filter(Boolean).map((n) => `pool/${n}`).join(', ');
    if (m.type === 'welcome') status(m.workers > 1 ? t('welcome', { model: offered, n: m.workers }) : t('welcome-alone', { model: offered }));
    if (m.type === 'job') queue = queue.then(() => run(sock, m));
    if (m.type === 'cancel') { cancelled.add(m.id); try { engine?.interruptGenerate(); } catch {} }
  };
  sock.onclose = () => {
    clearInterval(ping);
    if (!sharing || sock !== ws) return;
    // Lost the connection: try again, waiting a little longer each time.
    const wait = Math.min(30, 2 ** retry++) * 1000;
    status(t('connection-lost', { seconds: wait / 1000 }));
    setTimeout(connect, wait);
  };
}

// With thinking off, Qwen3 still starts each reply with an empty
// "<think>\n\n</think>\n\n". Hold the start back until it's clearly not that.
function thinkStripper() {
  let head = '', state = 'start'; // start: maybe the block; lead: drop the blank after it; pass
  return {
    push(d) {
      if (state === 'pass') return d;
      head += d;
      if (state === 'start') {
        const t = head.trimStart();
        if ('<think>'.startsWith(t)) return '';
        if (!t.startsWith('<think>')) { state = 'pass'; const h = head; head = ''; return h; }
        const i = t.indexOf('</think>');
        if (i < 0) return '';
        head = t.slice(i + 8);
        state = 'lead';
      }
      head = head.trimStart();
      if (!head) return '';
      state = 'pass';
      const h = head; head = ''; return h;
    },
    end() { return state === 'start' && !head.trimStart().startsWith('<think>') ? head : ''; },
  };
}

// The upscaler's weights: from Cache Storage, else downloaded and checked
// against the pool's list (the same file and SHA-256 the app checks).
async function loadUpscaler() {
  status(t('starting'));
  const entry = (await (await fetch('/app/models')).json()).models.find((m) => m.name === UPSCALER);
  const url = `/app/files/${entry.file}`;
  const cache = await caches.open('upscale');
  let res = await cache.match(url);
  if (!res) { res = await fetch(url); if (!res.ok) throw new Error(`upscaler ${res.status}`); }
  const bytes = new Uint8Array(await res.clone().arrayBuffer());
  const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map((b) => b.toString(16).padStart(2, '0')).join('');
  if (hash !== entry.sha256) { await cache.delete(url); throw new Error('the upscaler file does not match the list'); }
  await cache.put(url, res);
  const { default: init, WebUpscaler } = await import('/upscale/upscale.js');
  await init();
  return WebUpscaler.create(UPSCALER, bytes);
}

// A picture in (base64), the same 4x as RGBA from the upscaler, back as a JPEG.
async function upscale(sock, job, row, started) {
  const blob = new Blob([Uint8Array.from(atob(job.image), (c) => c.charCodeAt(0))]);
  const img = await createImageBitmap(blob);
  const { width: w, height: h } = img;
  if (w * h > UPSCALE_MAX) throw new Error('picture too big');
  const c = new OffscreenCanvas(w, h);
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  const out = await upscaler.rgba(new Uint8Array(g.getImageData(0, 0, w, h).data.buffer), w, h);
  if (cancelled.has(job.id)) return 'stopped';
  const big = new OffscreenCanvas(w * 4, h * 4);
  big.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(out.buffer), w * 4, h * 4), 0, 0);
  const jpeg = new Uint8Array(await (await big.convertToBlob({ type: 'image/jpeg', quality: 0.9 })).arrayBuffer());
  let bin = '';
  for (let i = 0; i < jpeg.length; i += 0x8000) bin += String.fromCharCode(...jpeg.subarray(i, i + 0x8000));
  sock.send(JSON.stringify({ type: 'done', id: job.id, image: btoa(bin), width: w * 4, height: h * 4, usage: {} }));
  return true;
}

async function run(sock, job) {
  const row = addRow(job.model);
  const started = performance.now();
  let tokens = 0, usage = null, finish = 'stop';
  const show = (done) => {
    const n = usage?.completion_tokens ?? tokens;
    row.className = done ? '' : 'running';
    // The tokens column says what came of it when the work didn't finish.
    row.children[2].textContent = done === 'stopped' ? t('row-stopped') : done === 'failed' ? t('row-failed') : done === 'picture' ? t('row-picture') : n.toLocaleString();
    row.children[3].textContent = oneDecimal.format((performance.now() - started) / 1000);
  };
  const send = (content) => content && sock.send(JSON.stringify({ type: 'delta', id: job.id, content }));
  const strip = thinkStripper();
  status(t('working'));
  try {
    if (job.kind === 'upscale') {
      if (job.model !== UPSCALER || !upscaler) throw new Error(`this tab has no ${job.model}`);
      const r = await upscale(sock, job, row, started);
      show(r === 'stopped' ? 'stopped' : 'picture');
      return;
    }
    if (!engine || job.model !== loaded) throw new Error(`this tab has no ${job.model}`);
    const stream = await engine.chat.completions.create({
      messages: job.messages, max_tokens: job.max_tokens,
      ...(job.temperature != null ? { temperature: job.temperature } : {}),
      ...(job.top_p != null ? { top_p: job.top_p } : {}),
      ...(job.stop ? { stop: job.stop } : {}),
      ...(job.seed != null ? { seed: job.seed } : {}),
      ...(job.response_format ? { response_format: job.response_format } : {}),
      ...(MODELS[loaded].noThinking ? { extra_body: { enable_thinking: false } } : {}),
      stream: true, stream_options: { include_usage: true },
    });
    for await (const c of stream) {
      if (cancelled.has(job.id)) break;
      const d = c.choices?.[0]?.delta?.content;
      if (d) { send(strip.push(d)); tokens++; show(false); }
      if (c.choices?.[0]?.finish_reason) finish = c.choices[0].finish_reason;
      if (c.usage) usage = c.usage;
    }
    if (cancelled.has(job.id)) {
      show('stopped');
    } else {
      send(strip.end());
      sock.send(JSON.stringify({ type: 'done', id: job.id, finish_reason: finish,
        usage: { prompt_tokens: usage?.prompt_tokens, completion_tokens: usage?.completion_tokens ?? tokens } }));
      show(true);
    }
  } catch (e) {
    console.warn('job failed', e);
    if (sock.readyState === 1) sock.send(JSON.stringify({ type: 'error', id: job.id, message: String(e?.message ?? e).slice(0, 200) }));
    show('failed');
  } finally {
    cancelled.delete(job.id);
    job.messages = null; // the prompt is not kept
    job.image = null;    // nor the picture
    if (sharing) status(t('waiting'));
  }
}

const oneDecimal = new Intl.NumberFormat(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
function addRow(model) {
  const row = document.createElement('tr');
  row.className = 'running';
  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  for (const text of [time, model, '', '']) { const td = document.createElement('td'); td.textContent = text; row.append(td); }
  $('job-rows').prepend(row);
  while ($('job-rows').children.length > 50) $('job-rows').lastChild.remove();
  return row;
}

// Both models, from both kinds of storage.
async function removeModels() {
  if (sharing) await stop();
  try {
    const webllm = await import(WEBLLM);
    for (const name of Object.keys(MODELS)) {
      const id = await modelId(name);
      for (const cacheBackend of ['cache', 'indexeddb']) {
        await webllm.deleteModelAllInfoInCache(id, { ...webllm.prebuiltAppConfig, cacheBackend }).catch(() => {});
      }
    }
    await caches.delete('upscale');
    status(t('removed'));
  } catch (e) {
    status(t('cant-remove', { error: String(e?.message ?? e).slice(0, 160) }));
  }
}
</script>
</body>
</html>
